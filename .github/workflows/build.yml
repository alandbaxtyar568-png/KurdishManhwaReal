name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Create project files
        run: |
          mkdir -p $(dirname settings.gradle)
          cat > settings.gradle <<'KMEOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KurdishManhwaReal"
          include ':app'
          KMEOF
          mkdir -p $(dirname build.gradle)
          cat > build.gradle <<'KMEOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          KMEOF
          mkdir -p $(dirname gradle.properties)
          cat > gradle.properties <<'KMEOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          KMEOF
          mkdir -p $(dirname app/build.gradle)
          cat > app/build.gradle <<'KMEOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.kurdish.manhwareal'
              compileSdk 34

              defaultConfig {
                  applicationId "com.kurdish.manhwareal"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'

              // ML Kit - Latin text recognition (English)
              implementation 'com.google.mlkit:text-recognition:16.0.0'
          }
          KMEOF
          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml <<'KMEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="Kurdish Manhwa Real"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".KurdishRealTimeTranslatorService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />

                  <service
                      android:name=".OverlayAccessibilityService"
                      android:exported="false"
                      android:label="Kurdish Manhwa Real"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>

          </manifest>
          KMEOF
          mkdir -p $(dirname app/src/main/res/layout/activity_main.xml)
          cat > app/src/main/res/layout/activity_main.xml <<'KMEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#121212"
              android:gravity="center"
              android:orientation="vertical"
              android:padding="24dp">

              <ImageView
                  android:layout_width="240dp"
                  android:layout_height="240dp"
                  android:layout_marginBottom="16dp"
                  android:contentDescription="Kurdish Manhwa Real"
                  android:src="@drawable/ic_launcher_foreground" />

              <TextView
                  android:id="@+id/txtTitle"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginBottom="40dp"
                  android:text="Kurdish Manhwa Real"
                  android:textColor="#FFFFFF"
                  android:textSize="28sp"
                  android:textStyle="bold" />

              <Button
                  android:id="@+id/btnToggleService"
                  android:layout_width="match_parent"
                  android:layout_height="65dp"
                  android:backgroundTint="#1E88E5"
                  android:text="چالاککردنی وەرگێڕانی کاتی ڕاستەقینە"
                  android:textColor="#FFFFFF"
                  android:textSize="18sp"
                  android:textStyle="bold" />

          </LinearLayout>
          KMEOF
          mkdir -p $(dirname app/src/main/res/values/ic_launcher_background.xml)
          cat > app/src/main/res/values/ic_launcher_background.xml <<'KMEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#10151B</color>
          </resources>
          KMEOF
          mkdir -p $(dirname app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml)
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'KMEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          KMEOF
          mkdir -p $(dirname app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml)
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'KMEOF'
