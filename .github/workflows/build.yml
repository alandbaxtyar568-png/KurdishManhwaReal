              fun identify(jpeg: ByteArray): List<Manhwa> {
                  val key = Store.apiKey
                  if (key.isBlank()) throw Exception("کلیلی AI دانەنراوە")
                  val prompt = """You are an expert on Korean manhwa, webtoons, manga and manhua. Look at the image. It may be a cover, a screenshot of a panel or page, or a hand drawing / fan art of a character. Identify which Korean manhwa or webtoon it comes from. Give up to 6 candidate titles, the most likely first, using the exact English or romanized title as listed on AniList. If you cannot recognise it, return []. Return ONLY a JSON array, no other text: [{"title":"...","reason":"one short sentence in Kurdish Sorani (Arabic script) saying what in the image matches"}]"""

                  val parts = JSONArray()
                      .put(JSONObject().put("text", prompt))
                      .put(
                          JSONObject().put(
                              "inline_data",
                      .put("generationConfig", JSONObject().put("temperature", 0.3).put("responseMimeType", "application/json"))

                  val resp = Net.httpPost(
                      "https://generativelanguage.googleapis.com/v1beta/models/" + Store.model + ":generateContent",
                      body.toString(),
                      mapOf("Content-Type" to "application/json", "x-goog-api-key" to key)
                  )
                  val text = JSONObject(resp).getJSONArray("candidates").getJSONObject(0)
                      .getJSONObject("content").getJSONArray("parts").getJSONObject(0).getString("text")
                  val startIdx = text.indexOf('[')
                  val endIdx = text.lastIndexOf(']')
                  if (startIdx < 0 || endIdx <= startIdx) throw Exception("وەڵامی AI تێنەگەیشتم")
                  val arr = JSONArray(text.substring(startIdx, endIdx + 1))

                  val wanted = ArrayList<Pair<String, String>>()
                  for (i in 0 until arr.length()) {
                      val o = arr.optJSONObject(i) ?: continue
                      val t = o.s("title")
                      if (t.isNotBlank()) wanted.add(Pair(t, o.s("reason")))
                      })
                  }
                  val out = ArrayList<Manhwa>()
                  val seen = HashSet<Int>()
                  for ((i, f) in futures.withIndex()) {
                      val m: Manhwa? = try { f.get() } catch (ex: Exception) { null }
                      if (m != null && seen.add(m.id)) {
                          m.reason = wanted[i].second
                          out.add(m)
                      }
                  }
                  return out
              }
