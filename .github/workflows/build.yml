name: Build User APK  on:   workflow_dispatch:   push:     branches: [ main, master ]  jobs:   build:     runs-on: ubuntu-latest     steps:       - uses: actions/checkout@v4        - uses: actions/setup-java@v4         with:           distribution: temurin           java-version: '17'        - uses: gradle/actions/setup-gradle@v3         with:           gradle-version: '8.9'        - name: Create project files         run: |           mkdir -p $(dirname settings.gradle)           cat > settings.gradle <<'KMEOF'           pluginManagement {               repositories {                   google()                   mavenCentral()                   gradlePluginPortal()               }           }           dependencyResolutionManagement {               repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)               repositories {                   google()                   mavenCentral()               }           }           rootProject.name = "KurdishManhwaReal"           include ':app'           KMEOF           mkdir -p $(dirname build.gradle)           cat > build.gradle <<'KMEOF'           plugins {               id 'com.android.application' version '8.6.1' apply false               id 'org.jetbrains.kotlin.android' version '1.9.22' apply false           }           KMEOF           mkdir -p $(dirname gradle.properties)           cat > gradle.properties <<'KMEOF'           org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8           android.useAndroidX=true           kotlin.code.style=official           KMEOF           mkdir -p $(dirname app/build.gradle)           cat > app/build.gradle <<'KMEOF'           plugins {               id 'com.android.application'               id 'org.jetbrains.kotlin.android'           }            android {               namespace 'com.kurdish.manhwareal'               compileSdk 35                buildFeatures {                   buildConfig true               }                signingConfigs {                   km {                       storeFile file("km.keystore")                       storePassword System.getenv("KM_STORE_PASS") ?: "kmpass123"                       keyAlias "km"                       keyPassword System.getenv("KM_STORE_PASS") ?: "kmpass123"                   }               }                buildTypes {                   debug {                       signingConfig signingConfigs.km                   }                   release {                       signingConfig signingConfigs.km                   }               }                flavorDimensions "role"               productFlavors {                   user {                       dimension "role"                       buildConfigField "boolean", "IS_ADMIN", "false"                       manifestPlaceholders = [appLabel: "Kurdish Manhwa Real"]                   }                   admin {                       dimension "role"                       applicationIdSuffix ".admin"                       buildConfigField "boolean", "IS_ADMIN", "true"                       manifestPlaceholders = [appLabel: "KMR Admin"]                   }               }                defaultConfig {                   applicationId "com.kurdish.manhwareal"                   minSdk 26                   targetSdk 35                   versionCode 1                   versionName "1.0"               }                compileOptions {                   sourceCompatibility JavaVersion.VERSION_17                   targetCompatibility JavaVersion.VERSION_17               }               kotlinOptions {                   jvmTarget = '17'               }           }            dependencies {               implementation 'androidx.core:core-ktx:1.12.0'               implementation 'androidx.appcompat:appcompat:1.6.1'               implementation 'com.google.android.material:material:1.11.0'               implementation 'androidx.recyclerview:recyclerview:1.3.2'                // ML Kit - Latin text recognition (English)               implementation 'com.google.mlkit:text-recognition:16.0.0'                // Google Sign-In (Credential Manager)               implementation 'androidx.credentials:credentials:1.3.0'               implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'               implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'           }           KMEOF           mkdir -p $(dirname app/src/main/AndroidManifest.xml)           cat > app/src/main/AndroidManifest.xml <<'KMEOF'           <?xml version="1.0" encoding="utf-8"?>           <manifest xmlns:android="http://schemas.android.com/apk/res/android">                <uses-permission android:name="android.permission.INTERNET" />               <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />               <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />               <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />               <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />                <application                   android:allowBackup="true"                   android:largeHeap="true"                   android:icon="@mipmap/ic_launcher"                   android:roundIcon="@mipmap/ic_launcher_round"                   android:label="${appLabel}"                   android:supportsRtl="true"                   android:usesCleartextTraffic="true"                   android:theme="@style/Theme.AppCompat.NoActionBar">                    <activity                       android:name=".MainActivity"                       android:exported="true"                       android:windowSoftInputMode="adjustResize">                       <intent-filter>                           <action android:name="android.intent.action.MAIN" />                           <category android:name="android.intent.category.LAUNCHER" />                       </intent-filter>                   </activity>                    <service                       android:name=".KurdishRealTimeTranslatorService"                       android:enabled="true"                       android:exported="false"                       android:foregroundServiceType="mediaProjection" />               </application>            </manifest>           KMEOF           mkdir -p $(dirname app/src/main/res/values/ic_launcher_background.xml)           cat > app/src/main/res/values/ic_launcher_background.xml <<'KMEOF'           <?xml version="1.0" encoding="utf-8"?>           <resources>               <color name="ic_launcher_background">#0B0F1A</color>           </resources>           KMEOF           mkdir -p $(dirname app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml)           cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'KMEOF'           <?xml version="1.0" encoding="utf-8"?>           <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">               <background android:drawable="@color/ic_launcher_background" />               <foreground android:drawable="@drawable/ic_launcher_foreground" />           </adaptive-icon>           KMEOF           mkdir -p $(dirname app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml)           cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'KMEOF'           <?xml version="1.0" encoding="utf-8"?>           <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">               <background android:drawable="@color/ic_launcher_background" />               <foreground android:drawable="@drawable/ic_launcher_foreground" />           </adaptive-icon>           KMEOF           mkdir -p $(dirname app/src/main/java/com/kurdish/manhwareal/Secrets.kt)           cat > app/src/main/java/com/kurdish/manhwareal/Secrets.kt <<'KMEOF'           package com.kurdish.manhwareal            object Secrets {               // ناونیشانی Worker (کلیلەکان تەنها لەوێن، نەک لە ئەپەکە)               const val PROXY = "https://yellow-limit-446a.alandbaxtyar568.workers.dev"                // Web client ID ی Google Cloud (لە workflow ەوە دادەنرێت، نهێنی نییە)               const val GOOGLE_CLIENT_ID = "603610294387-l7bodk71diot2v63le8gpd7olfj811it.apps.googleusercontent.com"     
