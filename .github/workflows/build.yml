          cat > app/src/main/java/com/kurdish/manhwareal/KurdishRealTimeTranslatorService.kt <<'KMEOF'
          package com.kurdish.manhwareal

          import android.app.Activity
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Bitmap
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Rect
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.Image
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.SystemClock
          import android.util.DisplayMetrics
          import android.util.Log
          import android.util.TypedValue
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.widget.FrameLayout
          import android.widget.TextView
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.text.TextRecognition
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions
          import org.json.JSONArray
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder
          import java.util.concurrent.Callable
          import java.util.concurrent.ConcurrentHashMap
          import java.util.concurrent.Executors
          import java.util.concurrent.TimeUnit
          import kotlin.math.abs

          class KurdishRealTimeTranslatorService : Service() {

              private class Block(val text: String, val rect: Rect, val bg: Int)

              private val handler = Handler(Looper.getMainLooper())
              private val checkInterval = 80L
              private val stableMs = 160L // ئەگەر ١٦٠ms وێنەی نوێ نەهات = سکڕۆڵ وەستاوە
              private val captureWidth = 720f // وێنەگرتن بە قەبارەی بچووکتر بۆ خێرایی

              // ناوچەی سەرەوە (ستاتۆس بار + ئەدرێس بار) و خوارەوە کە وەرناگێڕدرێت
              private val topIgnore = 0.12f
              private val bottomIgnore = 0.03f

              // ئەگەر زیاتر لەم ڕێژەیە لە وێنەکە گۆڕا، واتە سکڕۆڵ دەکرێت
              private val changeThreshold = 0.006f

              private var screenW = 0
              private var screenH = 0
              private var capW = 0
              private var capH = 0
              private var scale = 1f
              private var lastFrameTime = 0L
              private var mediaProjection: MediaProjection? = null
              private var virtualDisplay: VirtualDisplay? = null
              private var imageReader: ImageReader? = null
              private var windowManager: WindowManager? = null
              private var container: FrameLayout? = null

              private val recognizer by lazy { TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS) }
              private val orchestrator = Executors.newSingleThreadExecutor()
              private val workers = Executors.newFixedThreadPool(4)
              private val cache = ConcurrentHashMap<String, String>()

              private var lastBitmap: Bitmap? = null
              private var prevSig: IntArray? = null
              private var overlayVisible = false
              private var needsTranslate = true
              private var needFreshFrame = false
              private var suppressUntil = 0L
              private var isProcessing = false
              private var generation = 0
              private var started = false

              private val runnableCode = object : Runnable {
                  override fun run() {
                      if (!started) return
                      try {
                          captureAndProcess()
                      } catch (e: Exception) {
                          Log.e(TAG, "هەڵە: ${e.message}")
                      }
                      handler.postDelayed(this, checkInterval)
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (started) return START_NOT_STICKY

                  createNotificationChannel()
                  val notification = Notification.Builder(this, CHANNEL_ID)
                      .setContentTitle("Kurdish Manhwa Real")
                      .setContentText("چاودێری شاشە دەکرێت بۆ وەرگێڕانی خێرا...")
                      .setSmallIcon(android.R.drawable.ic_menu_view)
                      .build()

                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  } else {
                      startForeground(1, notification)
                  }

                  val resultCode = intent?.getIntExtra("RESULT_CODE", Activity.RESULT_CANCELED) ?: Activity.RESULT_CANCELED
                  val dataIntent: Intent? = if (Build.VERSION.SDK_INT >= 33) {
                      intent?.getParcelableExtra("DATA_INTENT", Intent::class.java)
                  } else {
                      @Suppress("DEPRECATION")
                      intent?.getParcelableExtra("DATA_INTENT")
                  }

                  if (dataIntent == null || resultCode != Activity.RESULT_OK) {
                      stopSelf()
                      return START_NOT_STICKY
                  }

                  try {
                      val mpManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                      mediaProjection = mpManager.getMediaProjection(resultCode, dataIntent)
                      mediaProjection?.registerCallback(object : MediaProjection.Callback() {
                          override fun onStop() {
                              handler.post { stopSelf() }
                          }
                      }, handler)

                      setupScreenCapture()
                      setupOverlayWindow()
                      started = true
                      warmUp()
                      handler.post(runnableCode)
                  } catch (e: Exception) {
                      Log.e(TAG, "هەڵە لە دەستپێکردن: ${e.message}")
                      stopSelf()
                  }

                  return START_NOT_STICKY
              }

              private fun setupScreenCapture() {
                  val wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  val dpi = resources.displayMetrics.densityDpi
                  if (Build.VERSION.SDK_INT >= 30) {
                      val b = wm.maximumWindowMetrics.bounds
                      screenW = b.width()
                      screenH = b.height()
                  } else {
                      val m = DisplayMetrics()
                      @Suppress("DEPRECATION")
                      wm.defaultDisplay.getRealMetrics(m)
                      screenW = m.widthPixels
                      screenH = m.heightPixels
                  }
                  scale = if (screenW > captureWidth) captureWidth / screenW else 1f
                  capW = (screenW * scale).toInt()
                  capH = (screenH * scale).toInt()
                  imageReader = ImageReader.newInstance(capW, capH, PixelFormat.RGBA_8888, 2)
                  virtualDisplay = mediaProjection?.createVirtualDisplay(
                      "ScreenCapture", capW, capH, dpi,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                      imageReader?.surface, null, null
                  )
              }

              private fun setupOverlayWindow() {
                  val acc = OverlayAccessibilityService.instance
                      ?: throw IllegalStateException("Accessibility چالاک نییە")
                  val wm = acc.getSystemService(WINDOW_SERVICE) as WindowManager
                  windowManager = wm
                  val c = FrameLayout(acc)
                  container = c

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      if (Build.VERSION.SDK_INT >= 30) {
                          layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                      } else if (Build.VERSION.SDK_INT >= 28) {
                          layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                      }
                  }
                  wm.addView(c, params)
              }

              private fun warmUp() {
                  try {
                      recognizer.process(InputImage.fromBitmap(Bitmap.createBitmap(32, 32, Bitmap.Config.ARGB_8888), 0))
                  } catch (_: Exception) {}
                  workers.execute { translate("hello") }
              }

              // ---------- وێنەگرتن و دۆزینەوەی سکڕۆڵ ----------

              private fun toBitmap(image: Image): Bitmap? {
                  return try {
                      val plane = image.planes[0]
                      val pixelStride = plane.pixelStride
                      val rowPadding = plane.rowStride - pixelStride * image.width
                      val full = Bitmap.createBitmap(
                          image.width + rowPadding / pixelStride, image.height, Bitmap.Config.ARGB_8888
                      )
                      full.copyPixelsFromBuffer(plane.buffer)
                      if (rowPadding == 0) {
                          full
                      } else {
                          val cropped = Bitmap.createBitmap(full, 0, 0, image.width, image.height)
                          full.recycle()
                          cropped
                      }
                  } catch (e: Exception) {
                      Log.e(TAG, "هەڵە لە وێنەگرتن: ${e.message}")
                      null
                  } finally {
                      image.close()
                  }
              }

              private fun signature(bmp: Bitmap): IntArray {
                  val small = Bitmap.createScaledBitmap(bmp, SIG_W, SIG_H, true)
                  val px = IntArray(SIG_W * SIG_H)
                  small.getPixels(px, 0, SIG_W, 0, 0, SIG_W, SIG_H)
                  if (small !== bmp) small.recycle()
                  for (i in px.indices) {
                      val p = px[i]
                      px[i] = (Color.red(p) * 3 + Color.green(p) * 6 + Color.blue(p)) / 10
                  }
                  return px
              }

              private fun changedFraction(a: IntArray, b: IntArray): Float {
                  var n = 0
                  for (i in a.indices) {
                      if (abs(a[i] - b[i]) > 30) n++
                  }
                  return n.toFloat() / a.size
              }

              private fun captureAndProcess() {
                  val reader = imageReader ?: return
                  val image = reader.acquireLatestImage()
                  var newFrame = false
                  if (image != null) {
                      val fresh = toBitmap(image)
                      if (fresh != null) {
                          lastBitmap?.recycle()
                          lastBitmap = fresh
                          newFrame = true
                      }
                  }
                  // ئەگەر شاشە نەگۆڕابێت وێنەی نوێ نایەت، بۆیە دوایین وێنە بەکاردێنین
                  val bmp = lastBitmap ?: return

                  if (newFrame) {
                      lastFrameTime = SystemClock.uptimeMillis()
                      val sig = signature(bmp)
                      val prev = prevSig
                      prevSig = sig
                      if (!overlayVisible) needFreshFrame = false
                      if (SystemClock.uptimeMillis() < suppressUntil) return

                      if (prev == null) {
                          needsTranslate = true
                      } else if (changedFraction(prev, sig) > changeThreshold) {
                          // سکڕۆڵ دەکرێت: وەرگێڕانەکە بشارەوە
                          generation++
                          needsTranslate = true
                          if (overlayVisible) {
                              hideOverlay()
                              needFreshFrame = true
                          }
                          return
                      }
                  }

                  // شاشە وەستاوە و ئینگلیزییەکە دیارە: OCR بکە
                  if (needsTranslate && !overlayVisible && !needFreshFrame && !isProcessing &&
                      SystemClock.uptimeMillis() - lastFrameTime >= stableMs
                  ) {
                      needsTranslate = false
                      lastBitmap = null
                      runOcr(bmp, generation)
                  }
              }

              // ---------- OCR ----------

              private fun lum(c: Int): Int = (Color.red(c) * 299 + Color.green(c) * 587 + Color.blue(c) * 114) / 1000

              private fun sampleBg(bmp: Bitmap, r: Rect): Int {
                  val cx = (r.left + r.right) / 2
                  val cy = (r.top + r.bottom) / 2
                  val m = 6
                  val pts = listOf(
                      (r.left - m) to (r.top - m), cx to (r.top - m), (r.right + m) to (r.top - m),
                      (r.left - m) to cy, (r.right + m) to cy,
                      (r.left - m) to (r.bottom + m), cx to (r.bottom + m), (r.right + m) to (r.bottom + m)
                  )
                  val cols = ArrayList<Int>()
                  for ((x, y) in pts) {
                      if (x in 0 until bmp.width && y in 0 until bmp.height) cols.add(bmp.getPixel(x, y))
                  }
                  if (cols.isEmpty()) return Color.WHITE
                  cols.sortBy { lum(it) }
                  return cols[cols.size / 2] or (0xFF shl 24)
              }

              private fun runOcr(bmp: Bitmap, gen: Int) {
                  isProcessing = true
                  val h = bmp.height
                  recognizer.process(InputImage.fromBitmap(bmp, 0))
                      .addOnSuccessListener { visionText ->
                          if (!started || gen != generation) return@addOnSuccessListener
                          val blocks = ArrayList<Block>()
                          for (b in visionText.textBlocks) {
                              val box = b.boundingBox ?: continue
                              val t = b.text.replace("\n", " ").trim()
                              if (t.count { it.isLetter() } < 2) continue
                              if (box.top < h * topIgnore || box.bottom > h * (1f - bottomIgnore)) continue
                              val screenRect = Rect(
                                  (box.left / scale).toInt(), (box.top / scale).toInt(),
                                  (box.right / scale).toInt(), (box.bottom / scale).toInt()
                              )
                              blocks.add(Block(t, screenRect, sampleBg(bmp, box)))
                              if (blocks.size >= 12) break
                          }
                          if (blocks.isNotEmpty()) translateBlocks(blocks, gen)
                      }
                      .addOnFailureListener { e -> Log.e(TAG, "OCR هەڵە: ${e.message}") }
                      .addOnCompleteListener {
                          isProcessing = false
                          bmp.recycle()
                      }
              }

              // ---------- وەرگێڕان ----------

              private fun translate(text: String): String? {
                  cache[text]?.let { return it }
                  return try {
                      val urlString = "https://translate.googleapis.com/translate_a/single" +
                          "?client=gtx&sl=en&tl=ckb&dt=t&q=" + URLEncoder.encode(text.take(500), "UTF-8")
                      val conn = URL(urlString).openConnection() as HttpURLConnection
                      conn.requestMethod = "GET"
                      conn.connectTimeout = 4000
                      conn.readTimeout = 4000
                      conn.setRequestProperty("User-Agent", "Mozilla/5.0")
                      val response = conn.inputStream.bufferedReader().use { it.readText() }
                      val sub = JSONArray(response).getJSONArray(0)
                      val sb = StringBuilder()
                      for (i in 0 until sub.length()) {
                          sb.append(sub.getJSONArray(i).optString(0, ""))
                      }
                      val out = sb.toString().trim()
                      if (out.isNotEmpty()) cache[text] = out
                      if (out.isEmpty()) null else out
                  } catch (e: Exception) {
                      Log.e(TAG, "هەڵە لە وەرگێڕان: ${e.message}")
                      null
                  }
              }

              private fun translateBlocks(blocks: List<Block>, gen: Int) {
                  if (orchestrator.isShutdown) return
                  orchestrator.execute {
                      try {
                          // هەموو بلۆکەکان پێکەوە (پاڕەلێل) وەردەگێڕدرێن بۆ خێرایی
                          val futures = blocks.map { b -> workers.submit(Callable<String?> { translate(b.text) }) }
                          val results = futures.map { f ->
                              try { f.get(6, TimeUnit.SECONDS) } catch (e: Exception) { null }
                          }
                          handler.post {
                              if (started && gen == generation && !overlayVisible) showBlocks(blocks, results)
                          }
                      } catch (e: Exception) {
                          Log.e(TAG, "هەڵە: ${e.message}")
                      }
                  }
              }

              // ---------- نیشاندان لەجێی ئینگلیزییەکە ----------

              private fun showBlocks(blocks: List<Block>, results: List<String?>) {
                  val c = container ?: return
                  c.removeAllViews()
                  val loc = IntArray(2)
                  c.getLocationOnScreen(loc)
                  var shown = 0

                  for (i in blocks.indices) {
                      val tr = results[i] ?: continue
                      val b = blocks[i]
                      val padX = (b.rect.width() * 0.08f).toInt() + 10
                      val padY = (b.rect.height() * 0.06f).toInt() + 8
                      val left = (b.rect.left - padX).coerceAtLeast(0)
                      val top = (b.rect.top - padY).coerceAtLeast(0)
                      val right = (b.rect.right + padX).coerceAtMost(screenW)
                      val bottom = (b.rect.bottom + padY).coerceAtMost(screenH)
                      if (right <= left || bottom <= top) continue

                      val tv = TextView(this)
                      tv.setAutoSizeTextTypeUniformWithConfiguration(6, 30, 1, TypedValue.COMPLEX_UNIT_SP)
                      tv.text = tr
                      tv.setTextColor(if (lum(b.bg) > 150) Color.BLACK else Color.WHITE)
                      tv.typeface = Typeface.DEFAULT_BOLD
                      tv.gravity = Gravity.CENTER
                      tv.textDirection = View.TEXT_DIRECTION_RTL
                      tv.includeFontPadding = false
                      tv.setPadding(4, 2, 4, 2)
                      tv.alpha = 1f
                      val bgShape = GradientDrawable()
                      bgShape.setColor(b.bg)
                      bgShape.cornerRadius = 14f
                      tv.background = bgShape

                      val lp = FrameLayout.LayoutParams(right - left, bottom - top)
                      lp.leftMargin = left - loc[0]
                      lp.topMargin = top - loc[1]
                      c.addView(tv, lp)
                      shown++
                  }

                  if (shown > 0) {
                      overlayVisible = true
                      // گۆڕانی وێنەکە بەهۆی نیشاندانی خۆمانەوە وەک سکڕۆڵ لەبەرچاو نەگیرێت
                      suppressUntil = SystemClock.uptimeMillis() + 600
                  }
              }

              private fun hideOverlay() {
                  container?.removeAllViews()
                  overlayVisible = false
              }

              private fun createNotificationChannel() {
                  val channel = NotificationChannel(CHANNEL_ID, "Kurdish Manhwa Service", NotificationManager.IMPORTANCE_LOW)
                  getSystemService(NotificationManager::class.java)?.createNotificationChannel(channel)
              }

              override fun onDestroy() {
                  super.onDestroy()
                  started = false
                  handler.removeCallbacksAndMessages(null)
                  orchestrator.shutdownNow()
                  workers.shutdownNow()
                  try { recognizer.close() } catch (_: Exception) {}
                  virtualDisplay?.release()
                  imageReader?.close()
                  mediaProjection?.stop()
                  lastBitmap?.recycle()
                  lastBitmap = null
                  try {
                      container?.let { windowManager?.removeView(it) }
                  } catch (_: Exception) {}
                  container = null
              }

              override fun onBind(intent: Intent?): IBinder? = null

              companion object {
                  private const val TAG = "KurdishManhwa"
                  private const val CHANNEL_ID = "KurdishManhwaChannel"
                  private const val SIG_W = 48
                  private const val SIG_H = 96
              }
          }
          KMEOF

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: KurdishManhwaReal-apk
          path: app/build/outputs/apk/debug/app-debug.apk
