                  translateStatus.text = if (on) "چالاکە — بڕۆ بۆ مانهواکەت" else "ئامادەیە"
              }

              private fun toggleTranslator() {
                  if (KurdishRealTimeTranslatorService.running) {
                      stopService(Intent(this, KurdishRealTimeTranslatorService::class.java))
                      Net.ui.postDelayed({ refreshTranslateUi() }, 500)
                      return
                  }
                  if (!Settings.canDrawOverlays(this)) {
                      toast("تکایە مۆڵەتی Display over other apps چالاک بکە، پاشان دووبارە دوگمەکە بدە")
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + packageName)))
                      return
                  }
                  val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  captureLauncher.launch(mpm.createScreenCaptureIntent())
              }

