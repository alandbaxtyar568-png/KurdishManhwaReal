                  scroll.addView(row)
                  topBars.addView(scroll, LinearLayout.LayoutParams(WM, WW))
                  root.addView(topBars, LinearLayout.LayoutParams(WM, WW))

                  bar.setBackgroundColor(Ui.ACCENT2)
                  bar.visibility = View.GONE
                  root.addView(bar, LinearLayout.LayoutParams(0, dp(3)))

                  val frame = FrameLayout(act)
                  frame.addView(web, FrameLayout.LayoutParams(WM, WM))
                  overlay.layoutDirection = View.LAYOUT_DIRECTION_LTR
                  overlay.isClickable = false
                  overlay.isFocusable = false
                  frame.addView(overlay, FrameLayout.LayoutParams(WM, WM))
                  chOverlay.layoutDirection = View.LAYOUT_DIRECTION_LTR
                  chOverlay.isClickable = false
                  chOverlay.isFocusable = false
                  frame.addView(chOverlay, FrameLayout.LayoutParams(WM, WM))

                  exitBtn = Ui.tv(act, "✕", 16f, Color.WHITE, true)
                  exitBtn.gravity = Gravity.CENTER
                  exitBtn.background = Ui.round(act, 0xAA000000.toInt(), 20)
                  exitBtn.visibility = View.GONE
                  exitBtn.setOnClickListener { setFullscreen(false) }
                  val elp = FrameLayout.LayoutParams(dp(40), dp(40), Gravity.TOP or Gravity.END)
                  elp.setMargins(dp(12), dp(12), dp(12), dp(12))
                  frame.addView(exitBtn, elp)

                  root.addView(frame, LinearLayout.LayoutParams(WM, 0, 1f))
                  styleTr()
              }

              @SuppressLint("SetJavaScriptEnabled")
              private fun setup() {
                  val st = web.settings
                  st.javaScriptEnabled = true
                  st.domStorageEnabled = true
                  st.loadWithOverviewMode = true
                  st.useWideViewPort = true
                  st.setSupportZoom(false)
                  st.builtInZoomControls = false
                  st.mixedContentMode = WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE
                  web.overScrollMode = View.OVER_SCROLL_NEVER
                  web.setBackgroundColor(Color.BLACK)
                  CookieManager.getInstance().setAcceptCookie(true)
                  CookieManager.getInstance().setAcceptThirdPartyCookies(web, true)

                  web.webViewClient = object : WebViewClient() {
                      override fun onPageStarted(view: WebView?, url: String?, favicon: Bitmap?) {
                          navGen++
                          clearOverlay()
                          chCancel()
                          if (url != null) urlEt.setText(url)
                      }

                      override fun onPageFinished(view: WebView?, url: String?) {
                          if (translating) {
                              if (Quota.needs(url)) {
                                  Quota.begin(act, url) { ok ->
                                      if (!ok) {
                                          translating = false
                                          styleTr()
                                          clearOverlay()
                                      }
                                  }
                              }
                              schedule(500)
                              handler.postDelayed(ocrRunnable, 1800)
                              handler.postDelayed(ocrRunnable, 4000)
                          }
                      }

                      override fun shouldOverrideUrlLoading(view: WebView?, request: WebResourceRequest?): Boolean {
                          val scheme = request?.url?.scheme ?: return false
                          return scheme != "http" && scheme != "https"
                      }
                  }

                  web.webChromeClient = object : WebChromeClient() {
                      override fun onProgressChanged(view: WebView?, newProgress: Int) {
                          val lp = bar.layoutParams
                          lp.width = root.width * newProgress / 100
                          bar.layoutParams = lp
                          bar.visibility = if (newProgress >= 100) View.GONE else View.VISIBLE
                      }
                  }

                  web.setOnTouchListener { _, ev ->
                      when (ev.actionMasked) {
                          android.view.MotionEvent.ACTION_DOWN -> {
                              tapX = ev.x
                              tapY = ev.y
                              tapT = SystemClock.uptimeMillis()
                          }
                          android.view.MotionEvent.ACTION_UP -> {
                              if (fullscreen && Math.abs(ev.x - tapX) < 25f && Math.abs(ev.y - tapY) < 25f &&
                                  SystemClock.uptimeMillis() - tapT < 350
                              ) showExitTemporarily()
                          }
                      }
                      false
                  }

                  web.setOnScrollChangeListener { _, sx, sy, _, _ ->
                      reposition(sx, sy)
                      if (chItems.isNotEmpty()) chSync()
                      if (translating) {
                          val now = SystemClock.uptimeMillis()
                          handler.removeCallbacks(ocrRunnable)
                          if (!busy && now - lastOcr > 300) runOcr() else handler.postDelayed(ocrRunnable, 140)
                      }
                  }

                  web.addOnLayoutChangeListener { _, l, t, r, b, ol, ot, orr, ob ->
                      if (chItems.isNotEmpty()) {
                          if (r - l != orr - ol) chCancel() else chSync()
                      }
                      if (r - l != orr - ol || b - t != ob - ot) {
                          clearOverlay()
                          if (translating) schedule(350)
                      }
                  }
              }

              // ---------------- ناوبری ----------------

              private fun normalize(s: String): String {
                  val t = s.trim()
                  if (t.startsWith("http://") || t.startsWith("https://")) return t
                  if (!t.contains(' ') && t.contains('.')) return "https://" + t
                  return "https://www.google.com/search?q=" + URLEncoder.encode(t, "UTF-8")
              }

              private fun hideKb() {
                  val imm = act.getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager
                  imm.hideSoftInputFromWindow(urlEt.windowToken, 0)
                  urlEt.clearFocus()
              }

              fun open(input: String) {
                  if (input.isBlank()) return
                  hideKb()
                  web.loadUrl(normalize(input))
              }

              fun onShown() {
                  if (!loaded) {
                      loaded = true
                      open("https://asurascans.com")
                  }
                  if (translating) schedule(200)
              }

              fun setFullscreen(on: Boolean) {
                  if (fullscreen == on) return
                  fullscreen = on
                  topBars.visibility = if (on) View.GONE else View.VISIBLE
                  handler.removeCallbacks(hideExit)
                  exitBtn.visibility = View.GONE
                  onFullscreen?.invoke(on)
              }

              fun exitFullscreen() = setFullscreen(false)

              private fun showExitTemporarily() {
                  exitBtn.visibility = View.VISIBLE
                  handler.removeCallbacks(hideExit)
                  handler.postDelayed(hideExit, 3000)
              }

              fun back(): Boolean {
                  if (fullscreen) {
                      setFullscreen(false)
                      return true
                  }
                  if (web.canGoBack()) {
                      web.goBack()
                      return true
                  }
                  return false
              }

              fun destroy() {
                  chGen++
                  handler.removeCallbacksAndMessages(null)
                  try {
                      web.stopLoading()
                      (web.parent as? ViewGroup)?.removeView(web)
                      web.destroy()
                  } catch (_: Exception) { }
                  try { recognizer.close() } catch (_: Exception) { }
              }


              // ---------------- هەموو چاپتەر بە یەک جار ----------------

              private fun styleCh(text: String, active: Boolean) {
                  chBtn.text = text
                  chBtn.setTextColor(if (active) Color.WHITE else Ui.TEXT)
                  chBtn.background = if (active) Ui.grad(act, Ui.ACCENT, Ui.ACCENT2, 14) else Ui.round(act, Ui.SURFACE2, 14)
              }

              private fun styleP() {
                  polBtn.text = if (chPolish) "✨ چەند زیرەکی: چالاکە" else "✨ چەند زیرەکی: کوژاوەتەوە"
                  polBtn.setTextColor(if (chPolish) Color.WHITE else Ui.TEXT)
                  polBtn.background = if (chPolish) Ui.grad(act, Ui.ACCENT, Ui.ACCENT2, 14) else Ui.round(act, Ui.SURFACE2, 14)
              }

              private fun chCancel() {
                  chGen++
                  chState = 0
                  chItems.clear()
                  chPending.clear()
                  chOverlay.removeAllViews()
                  if (::chBtn.isInitialized) styleCh("⚡ هەموو چاپتەر", false)
              }

              private fun chToggle() {
                  if (chState != 0) chCancel() else chStart()
              }

              private fun chStart() {
                  Quota.begin(act, web.url) { ok -> if (ok) chRun() }
              }

              private fun chRun() {
                  if (web.width <= 0 || web.windowToken == null) return
                  translating = false
                  handler.removeCallbacks(ocrRunnable)
                  styleTr()
                  clearOverlay()
                  chCancel()
                  chState = 1
                  val gen = chGen
                  styleCh("⏳ ئامادەکردنی لاپەڕە...", true)
                  web.evaluateJavascript(JS_SCROLL, null)
                  val t0 = SystemClock.uptimeMillis()
                  val poll = object : Runnable {
                      override fun run() {
                          if (gen != chGen) return
                          web.evaluateJavascript("(window.__km&&window.__km.done)?'1':'0'") { r ->
                              if (gen == chGen) {
                                  val done = r != null && r.contains("1")
                                  if (done || SystemClock.uptimeMillis() - t0 > 15000) {
                                      chCollect(gen)
                                  } else {
                                      handler.postDelayed(this, 200)
                                  }
                              }
                          }
                      }
                  }
                  handler.postDelayed(poll, 300)
              }

              private fun chFail(msg: String) {
                  chState = 0
                  styleCh(msg, false)
                  handler.postDelayed({ if (chState == 0) styleCh("⚡ هەموو چاپتەر", false) }, 2500)
              }

              private fun chCollect(gen: Int) {
                  web.evaluateJavascript(JS_IMGS) { raw ->
                      if (gen != chGen) return@evaluateJavascript
                      val parsed: JSONObject? = try {
                          JSONObject(JSONTokener(raw).nextValue() as String)
                      } catch (e: Exception) {
                          null
                      }
                      val arr = parsed?.optJSONArray("imgs")
                      val iw = parsed?.optDouble("iw", 0.0) ?: 0.0
                      if (arr == null || arr.length() == 0 || iw <= 0.0) {
                          chFail("✗ وێنەی چاپتەر نەدۆزرایەوە")
                          return@evaluateJavascript
                      }
                      val ratio = (web.width / iw).toFloat()
                      val ua = web.settings.userAgentString
                      val ref = web.url ?: ""
                      val cm = CookieManager.getInstance()
                      chImgTotal = arr.length()
                      chImgDone = 0
                      chGemOut = 0
                      chGemDone = 0
                      chPending.clear()
                      chProgress()
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          val img = Chapter.Img(
                              o.getString("src"), o.getDouble("x").toFloat(), o.getDouble("y").toFloat(),
                              o.getDouble("w").toFloat(), o.getDouble("h").toFloat()
                          )
                          Chapter.workers.execute {
                              val items: List<ChItem> = try {
                                  if (gen != chGen) {
                                      emptyList()
                                  } else {
                                      val bytes = Chapter.fetch(img.src, ref, ua, cm.getCookie(img.src))
                                      if (bytes == null || gen != chGen) emptyList() else Chapter.ocr(recognizer, bytes, img, ratio)
                                  }
                              } catch (e: Throwable) {
                                  emptyList()
                              }
                              handler.post { chOnImage(gen, items) }
                          }
                      }
                  }
              }

              private fun chOnImage(gen: Int, items: List<ChItem>) {
                  if (gen != chGen) return
                  chImgDone++
                  for (ci in items) {
                      if (Fast.isJunk(ci.text)) continue
                      chItems.add(ci)
                      chPending.add(ci)
                      Chapter.google(ci.text) { r ->
                          if (r != null) handler.post { chApply(gen, ci, r, false) }
                      }
                  }
                  if (chPending.size >= 18 || chImgDone >= chImgTotal) chFlush(gen)
                  chProgress()
                  chSync()
              }

              private fun chFlush(gen: Int) {
                  if (chPending.isEmpty()) return
                  val batch = chPending.sortedBy { it.py }
                  chPending.clear()
                  for (chunk in batch.chunked(24)) {
                      chGemOut++
                      Chapter.gemini(chunk.map { it.text }) { res ->
                          handler.post { chOnGemini(gen, chunk, res) }
                      }
                  }
              }

              private fun chOnGemini(gen: Int, chunk: List<ChItem>, res: List<String>?) {
                  if (gen != chGen) return
                  chGemOut--
                  chGemDone += chunk.size
                  for ((k, ci) in chunk.withIndex()) {
                      if (res != null && k < res.size) chApply(gen, ci, res[k], true) else ci.gem = true
                  }
                  if (chPolish) {
                      chGemOut++
                      Ensemble.refine(chunk.map { c -> c.text }, res) { fin ->
                          handler.post { chOnRefine(gen, chunk, fin) }
                      }
                  }
                  chProgress()
                  chSync()
              }

              private fun chOnRefine(gen: Int, chunk: List<ChItem>, fin: List<String>?) {
                  if (gen != chGen) return
                  chGemOut--
                  if (fin != null) {
                      for ((k, ci) in chunk.withIndex()) {
                          if (k < fin.size && fin[k].isNotBlank()) chApply(gen, ci, fin[k], true)
                      }
                  } else if (!Ensemble.anyAlive()) {
                      android.widget.Toast.makeText(act, "Worker ـەکە /llm ـی نییە، تەنها Gemini بەکار هات", android.widget.Toast.LENGTH_LONG).show()
                  }
                  chProgress()
                  chSync()
              }

              private fun chApply(gen: Int, ci: ChItem, text: String, gem: Boolean) {
                  if (gen != chGen) return
                  if (!gem && ci.gem) return
                  if (gem) ci.gem = true
                  val old = ci.tr
                  ci.tr = text
                  val v = ci.view
                  if (v != null && text.isNotEmpty() && old != text) Overlay.swap(v, text)
                  if (!gem) chSync()
              }

              private fun chProgress() {
                  if (chState == 0) return
                  val finished = chImgDone >= chImgTotal && chPending.isEmpty() && chGemOut <= 0
                  if (finished) {
                      chState = 2
                      styleCh("✓ چاپتەر وەرگێڕدرا (لابردن)", true)
                  } else {
                      styleCh((if (chPolish) "✨ " else "⏳ ") + chImgDone + "/" + chImgTotal + " وێنە · " + chGemDone + "/" + chItems.size + " دەق", true)
                  }
              }

              /** تەنها دەقی نزیک لە شاشە وەک View دروست دەکرێت، ئەوانی تر لادەبرێن (بۆ خێرایی و میمۆری) */
              private fun chSync() {
                  if (chItems.isEmpty()) return
                  val sx = web.scrollX
                  val sy = web.scrollY
                  val h = web.height
                  for (ci in chItems) {
                      val tr = ci.tr
                      val near = ci.py + ci.h > sy - 2 * h && ci.py < sy + 3 * h
                      var v = ci.view
                      if (near && !tr.isNullOrEmpty()) {
                          if (v == null) {
                              v = Overlay.make(act, tr, ci.bg, ci.fill, false, ci.inset, ci.textColor, ci.glow)
                              val lp = FrameLayout.LayoutParams(ci.w, ci.h)
                              lp.gravity = Gravity.TOP or Gravity.START
                              chOverlay.addView(v, lp)
                              ci.view = v
                          }
                          v.translationX = (ci.px - sx).toFloat()
                          v.translationY = (ci.py - sy).toFloat()
                      } else if (v != null) {
                          chOverlay.removeView(v)
                          ci.view = null
                      }
                  }
              }

              // ---------------- وەرگێڕان ----------------

              private fun styleTr() {
                  trBtn.text = if (translating) "◉ وەرگێڕان: چالاکە" else "○ وەرگێڕان: کوژاوەتەوە"
                  trBtn.setTextColor(if (translating) Color.WHITE else Ui.TEXT)
                  trBtn.background = if (translating) Ui.grad(act, Ui.ACCENT, Ui.ACCENT2, 14) else Ui.round(act, Ui.SURFACE2, 14)
              }

              private fun toggle() {
                  translating = !translating
                  styleTr()
                  if (translating) {
                      chCancel()
                      Quota.begin(act, web.url) { ok ->
                          if (ok) {
                              schedule(100)
                          } else {
                              translating = false
                              styleTr()
                          }
                      }
                  } else {
                      handler.removeCallbacks(ocrRunnable)
                      clearOverlay()
                  }
              }

              private fun schedule(delay: Long) {
                  handler.removeCallbacks(ocrRunnable)
                  handler.postDelayed(ocrRunnable, delay)
              }

              private fun clearOverlay() {
                  overlay.removeAllViews()
              }

              private fun reposition(x: Int, y: Int) {
                  for (i in 0 until overlay.childCount) {
                      val v = overlay.getChildAt(i)
                      val p = v.tag as? IntArray ?: continue
                      v.translationX = (p[0] - x).toFloat()
                      v.translationY = (p[1] - y).toFloat()
                  }
              }

              private fun lum(c: Int): Int = (Color.red(c) * 299 + Color.green(c) * 587 + Color.blue(c) * 114) / 1000

              private fun sampleBg(bmp: Bitmap, r: Rect): Int {
                  val cx = (r.left + r.right) / 2
                  val cy = (r.top + r.bottom) / 2
                  val m = 6
                  val pts = listOf(
                      (r.left - m) to (r.top - m), cx to (r.top - m), (r.right + m) to (r.top - m),
                      (r.left - m) to cy, (r.right + m) to cy,
                      (r.left - m) to (r.bottom + m), cx to (r.bottom + m), (r.right + m) to (r.bottom + m)
                  )
                  val cols = ArrayList<Int>()
                  for ((x, y) in pts) {
                      if (x in 0 until bmp.width && y in 0 until bmp.height) cols.add(bmp.getPixel(x, y))
                  }
                  if (cols.isEmpty()) return Color.WHITE
                  cols.sortBy { lum(it) }
                  return cols[cols.size / 2] or (0xFF shl 24)
              }

              private fun padRect(b: Rect): Rect {
                  val px = (b.width() * 0.12f).toInt() + 5
                  val py = (b.height() * 0.14f).toInt() + 4
                  return Rect(b.left - px, b.top - py, b.right + px, b.bottom + py)
              }

              /** ئایا ئەم شوێنە پێشتر دەقی کوردی لەسەر دانراوە؟ */
              private fun covered(pl: Int, pt: Int, pr: Int, pb: Int): Boolean {
                  val cx = (pl + pr) / 2
                  val cy = (pt + pb) / 2
                  for (i in 0 until overlay.childCount) {
                      val v = overlay.getChildAt(i)
                      val p = v.tag as? IntArray ?: continue
                      val lp = v.layoutParams
                      if (cx >= p[0] - 12 && cx <= p[0] + lp.width + 12 && cy >= p[1] - 12 && cy <= p[1] + lp.height + 12) return true
                  }
                  return false
              }

              private fun runOcr() {
                  if (!translating) return
                  if (root.visibility != View.VISIBLE) return
                  if (busy) {
                      schedule(200)
                      return
                  }
                  val w = web.width
                  val h = web.height
                  if (w <= 0 || h <= 0 || web.windowToken == null) return
                  val scale = if (w > 640) 640f / w else 1f
                  val bw = (w * scale).toInt().coerceAtLeast(1)
                  val bh = (h * scale).toInt().coerceAtLeast(1)
                  val bmp = try {
                      Bitmap.createBitmap(bw, bh, Bitmap.Config.ARGB_8888)
                  } catch (e: Throwable) {
                      return
                  }
                  busy = true
                  lastOcr = SystemClock.uptimeMillis()
                  val gen = navGen
                  val sx = web.scrollX
                  val sy = web.scrollY
                  val loc = IntArray(2)
                  web.getLocationInWindow(loc)
                  val src = Rect(loc[0], loc[1], loc[0] + w, loc[1] + h)
                  try {
                      PixelCopy.request(
                          act.window, src, bmp,
                          PixelCopy.OnPixelCopyFinishedListener { res ->
                              if (res == PixelCopy.SUCCESS) {
                                  analyze(bmp, scale, sx, sy, gen)
                              } else {
                                  bmp.recycle()
                                  busy = false
                              }
                          },
                          handler
                      )
                  } catch (e: Throwable) {
                      bmp.recycle()
                      busy = false
                  }
              }

              private fun analyze(bmp: Bitmap, scale: Float, sx: Int, sy: Int, gen: Int) {
                  recognizer.process(InputImage.fromBitmap(bmp, 0))
                      .addOnSuccessListener { vt ->
                          if (gen != navGen || !translating) {
                              busy = false
                              return@addOnSuccessListener
                          }
                          val blocks = ArrayList<Block>()
                          val raw = ArrayList<Merge.Item>()
                          for (b in vt.textBlocks) {
                              val box = b.boundingBox ?: continue
                              val t = b.text.replace("\n", " ").trim()
                              val nonSpace = t.count { !it.isWhitespace() }
                              if (nonSpace < 3 || t.count { it.isLetter() } < 2) continue
                              if (t.count { it.isLetter() }.toFloat() / nonSpace < 0.6f) continue
                              raw.add(Merge.Item(t, Rect(box)))
                          }
                          for (item in Merge.run(raw)) {
                              val box = item.box
                              val r = Rect(
                                  (box.left / scale).toInt(), (box.top / scale).toInt(),
                                  (box.right / scale).toInt(), (box.bottom / scale).toInt()
                              )
                              if (covered(r.left + sx, r.top + sy, r.right + sx, r.bottom + sy)) continue
                              val fr = Fill.build(bmp, box)
                              val core = fr?.let { f ->
                                  Rect(
                                      (f.rect.left / scale).toInt(), (f.rect.top / scale).toInt(),
                                      (f.rect.right / scale).toInt(), (f.rect.bottom / scale).toInt()
                                  )
                              }
                              val bgc = sampleBg(bmp, box)
                              val st = Style.detect(bmp, box, bgc)
                              blocks.add(Block(item.text, r, bgc, fr?.bmp, core, st.color, st.glow))
                              if (blocks.size >= 14) break
                          }
                          if (blocks.isEmpty()) {
                              busy = false
                              return@addOnSuccessListener
                          }
                          val views = arrayOfNulls<android.widget.TextView>(blocks.size)
                          Fast.translate(blocks.map { it.text }) { results, _ ->
                              handler.post { addBlocks(blocks, results, sx, sy, gen, views) }
                          }
                      }
                      .addOnFailureListener { busy = false }
                      .addOnCompleteListener { bmp.recycle() }
              }

              private fun addBlocks(
                  blocks: List<Block>, results: List<String?>, sx: Int, sy: Int, gen: Int,
                  views: Array<android.widget.TextView?>
              ) {
                  // لە یەکەم ئەنجامەوە OCR ی نوێ ڕێگەپێدراوە (Gemini ی خاو ڕێگر نابێت)
                  busy = false
                  if (!translating || gen != navGen) return
                  val maxW = web.width
                  val maxH = web.height

                  for (i in blocks.indices) {
                      val tr = results[i]
                      val old = views[i]
                      if (old != null) {
                          if (tr.isNullOrEmpty()) {
                              overlay.removeView(old)
                              views[i] = null
                          } else {
                              Overlay.swap(old, tr)
                          }
                          continue
                      }
                      if (tr.isNullOrEmpty()) continue
                      val b = blocks[i]
                      val padX = (b.rect.width() * 0.12f).toInt() + 10
                      val padY = (b.rect.height() * 0.14f).toInt() + 8
                      var left = (b.rect.left - padX).coerceAtLeast(0)
                      var top = (b.rect.top - padY).coerceAtLeast(0)
                      var right = (b.rect.right + padX).coerceAtMost(maxW)
                      var bottom = (b.rect.bottom + padY).coerceAtMost(maxH)
                      b.core?.let { c ->
                          left = minOf(left, c.left).coerceAtLeast(0)
                          top = minOf(top, c.top).coerceAtLeast(0)
                          right = maxOf(right, c.right).coerceAtMost(maxW)
                          bottom = maxOf(bottom, c.bottom).coerceAtMost(maxH)
                      }
                      if (right <= left || bottom <= top) continue

                      val pl = left + sx
                      val pt = top + sy
                      if (covered(pl, pt, pl + (right - left), pt + (bottom - top))) continue

                      val inset = b.core?.let {
                          intArrayOf(
                              (it.left - left).coerceAtLeast(0), (it.top - top).coerceAtLeast(0),
                              (right - it.right).coerceAtLeast(0), (bottom - it.bottom).coerceAtLeast(0)
                          )
                      }
                      val tv = Overlay.make(act, tr, b.bg, b.fill, true, inset, b.textColor, b.glow)
                      tv.tag = intArrayOf(pl, pt)
                      val lp = FrameLayout.LayoutParams(right - left, bottom - top)
                      lp.gravity = Gravity.TOP or Gravity.START
                      overlay.addView(tv, lp)
                      views[i] = tv
                  }

                  val cy = web.scrollY
                  var k = overlay.childCount - 1
                  while (k >= 0) {
                      val p = overlay.getChildAt(k).tag as? IntArray
                      if (p != null && Math.abs(p[1] - cy) > maxH * 3) overlay.removeViewAt(k)
                      k--
                  }
                  reposition(web.scrollX, web.scrollY)
              }
          }
          KMEOF
          mkdir -p $(dirname app/src/main/java/com/kurdish/manhwareal/Speed.kt)
          cat > app/src/main/java/com/kurdish/manhwareal/Speed.kt <<'KMEOF'
          package com.kurdish.manhwareal

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.Color
          import android.graphics.Rect
          import android.graphics.Typeface
          import android.graphics.drawable.BitmapDrawable
          import android.graphics.drawable.GradientDrawable
          import android.graphics.drawable.InsetDrawable
          import android.os.SystemClock
          import android.util.TypedValue
          import android.view.Gravity
          import android.view.View
          import android.widget.TextView
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder
          import java.util.concurrent.ConcurrentHashMap
          import java.util.concurrent.Executors
          import kotlin.math.abs

          /**
           * وەرگێڕانی خێرا: Google یەکسەر دەردەکەوێت، Gemini هاوکات کار دەکات
           * و کە تەواو بوو دەقە مرۆڤانەکەی جێگەی دەگرێتەوە.
           */
          object Fast {
              private val pool = Executors.newFixedThreadPool(8)
              private val cache = ConcurrentHashMap<String, String>()
              private const val GOOGLE_GRACE_MS = 2200L

              fun isJunk(t: String): Boolean {
                  val l = t.lowercase()
                  if (l.contains(".com") || l.contains("www") || l.contains("http") || l.contains("asura") || l.contains("scns")) return true
                  return t.count { it.isLetter() } < 2
              }

              // پیتی عەرەبی بگۆڕە بە پیتی کوردی + هەموو پیتە لاتینییەکان لابدە
              fun noLatin(s: String): String =
                  s.replace(Regex("[A-Za-z]+"), "")
                      .replace('ي', 'ی').replace('ى', 'ی').replace('ك', 'ک')
                      .replace('ة', 'ە').replace('ؤ', 'ۆ').replace('ھ', 'ه')
                      .replace(Regex("\\s+([؟!.,،])"), "$1")
                      .replace(Regex("\\s+"), " ").trim()

              fun google(text: String): String? {
                  return try {
                      val url = "https://translate.googleapis.com/translate_a/single" +
                          "?client=gtx&sl=en&tl=ckb&dt=t&q=" + URLEncoder.encode(text.take(500), "UTF-8")
                      val conn = URL(url).openConnection() as HttpURLConnection
                      conn.connectTimeout = 2500
                      conn.readTimeout = 3500
                      conn.setRequestProperty("User-Agent", "Mozilla/5.0")
                      val resp = try {
                          conn.inputStream.bufferedReader().use { it.readText() }
                      } finally {
                          conn.disconnect()
                      }
                      val sub = JSONArray(resp).getJSONArray(0)
                      val sb = StringBuilder()
                      for (i in 0 until sub.length()) sb.append(sub.getJSONArray(i).optString(0, ""))
                      val out = noLatin(sb.toString())
                      if (out.isEmpty()) null else out
                  } catch (e: Exception) {
                      null
                  }
              }

              fun geminiBody(prompt: String, thinkingOff: Boolean): String {
                  val part = JSONObject().put("text", prompt)
                  val content = JSONObject().put("parts", JSONArray().put(part))
                  val cfg = JSONObject().put("temperature", 0.5).put("responseMimeType", "application/json")
                  if (thinkingOff) cfg.put("thinkingConfig", JSONObject().put("thinkingBudget", 0))
                  return JSONObject().put("contents", JSONArray().put(content)).put("generationConfig", cfg).toString()
              }

              fun buildPrompt(texts: List<String>): String {
                  val arr = JSONArray()
                  for (t in texts) arr.put(t)
                  return "You are a professional Kurdish Sorani (Central Kurdish, Arabic script) translator who localizes " +
                          "Korean/Chinese manhwa and webtoons for Kurdish readers. Below is a JSON array of English snippets read by OCR " +
                          "from ONE page, in reading order (top to bottom). Each item is one speech bubble or narration box; OCR may break " +
                          "lines or words oddly, so first rebuild the real English sentence in your head.\n" +
                          "HOW TO TRANSLATE: never translate word by word and never copy English sentence structure. Understand who is " +
                          "speaking to whom and the emotion (anger, fear, sarcasm, respect), then say it exactly the way a native Kurdish " +
                          "speaker would say it out loud: natural Kurdish word order (verb at the end), correct verb conjugation and " +
                          "pronoun suffixes, natural idioms, no stiff or bookish phrasing. Use everyday spoken Sorani, but keep respectful " +
                          "wording for elders, masters and nobles. Keep each line short enough to fit in a bubble (about the same length " +
                          "as the English or shorter). Keep names consistent across the page.\n" +
                          "QUALITY EXAMPLE: 'What more do you want from me? Why are you after my life?' -> " +
                          "'چیتر چیت لە من دەوێت؟ بۆچی بە دوای گیانی مندا دەگەڕێیت؟' (natural), NOT a literal mirror of the English.\n" +
                          "RULES: (1) Kurdish Sorani Arabic script only, use Kurdish letters (ە ێ ۆ ڕ ڵ ک ی), NEVER any Latin letter - " +
                          "transliterate names and sound effects. (2) Fix obvious OCR mistakes using the other snippets. " +
                          "(3) Watermark, website name, scanlation credit or meaningless garbage -> empty string. " +
                          "(4) Return ONLY a JSON array of exactly " + texts.size + " strings, same order, no commentary.\n" + arr.toString()
              }

              fun ai(texts: List<String>): List<String>? {
                  return try {
                      val arr = JSONArray()
                      for (t in texts) arr.put(t)
                      val prompt = buildPrompt(texts)
                      val resp = try {
                          Net.callGemini(geminiBody(prompt, true))
                      } catch (e: Exception) {
                          // هەندێک مۆدێل thinkingBudget قبووڵ ناکەن
                          Net.callGemini(geminiBody(prompt, false))
                      }
                      val text = JSONObject(resp).getJSONArray("candidates").getJSONObject(0)
                          .getJSONObject("content").getJSONArray("parts").getJSONObject(0).getString("text")
                      val st = text.indexOf('[')
                      val en = text.lastIndexOf(']')
                      if (st < 0 || en <= st) return null
                      val out = JSONArray(text.substring(st, en + 1))
                      if (out.length() != texts.size) return null
                      val list = ArrayList<String>()
                      for (i in 0 until out.length()) list.add(noLatin(out.optString(i, "")))
                      list
                  } catch (e: Exception) {
                      null
                  }
              }

              /** onUpdate لە بەکگراوند بانگ دەکرێت: (ئەنجامەکان، ئایا کۆتایی هات؟). "" واتە دەقەکە لابدە */
              fun translate(texts: List<String>, onUpdate: (List<String?>, Boolean) -> Unit) {
                  val n = texts.size
                  val cur = arrayOfNulls<String>(n)
                  val need = ArrayList<Int>()
                  for (i in 0 until n) {
                      if (isJunk(texts[i])) {
                          cur[i] = ""
                          continue
                      }
                      val c = cache[texts[i]]
                      if (c != null) cur[i] = c else need.add(i)
                  }
                  if (need.isEmpty()) {
                      onUpdate(cur.toList(), true)
                      return
                  }

                  val lock = Any()
                  val t0 = SystemClock.uptimeMillis()
                  var aiState = 0 // 0 چاوەڕێ، 1 سەرکەوتوو، 2 شکستی هێنا
                  var remaining = need.size

                  // Gemini (مرۆڤانە)
                  pool.execute {
                      val res = ai(need.map { texts[it] })
                      synchronized(lock) {
                          if (res != null) {
                              aiState = 1
                              for ((k, i) in need.withIndex()) {
                                  cur[i] = res[k]
                                  cache[texts[i]] = res[k]
                              }
                              onUpdate(cur.toList(), true)
                          } else {
                              aiState = 2
                              if (remaining == 0) onUpdate(cur.toList(), true)
                          }
                      }
                  }
                  // Google (خێرا) بۆ هەر دەقێک جیا
                  for (i in need) {
                      pool.execute {
                          val r = google(texts[i])
                          // وەرگێڕانی Google خاوە؛ چاوەڕێی Gemini دەکەین و تەنها ئەگەر درەنگ کرد یان شکستی هێنا نیشانی دەدەین
                          var settled = false
                          var waited = SystemClock.uptimeMillis() - t0
                          while (!settled && waited < GOOGLE_GRACE_MS) {
                              synchronized(lock) { settled = aiState != 0 }
                              if (!settled) {
                                  try { Thread.sleep(40) } catch (_: InterruptedException) {}
                                  waited = SystemClock.uptimeMillis() - t0
                              }
                          }
                          synchronized(lock) {
                              remaining--
                              if (aiState != 1) {
                                  if (r != null) cur[i] = r
                                  val fin = aiState == 2 && remaining == 0
                                  if (r != null || fin) onUpdate(cur.toList(), fin)
                              }
                          }
                      }
                  }
              }
          }

          class FillResult(val bmp: Bitmap, val rect: Rect)

          /**
           * دەقی ئینگلیزی دەسڕێتەوە:
           *  - پشتەوەی ساف (بالۆنی سپی...) = بە ڕەنگی پشتەوە پڕدەکرێتەوە، هیچ شوێنەوارێک نامێنێت
           *  - پشتەوەی وێنە/گرادیەنت = پیکسێلی دەق لە دەوروبەرەوە دەخرێتە ناو (inpainting)، بێ هێڵی لار
           *  - هێڵی بالۆن و وێنەی پشتەوە (ئەوانەی دەگەنە لێواری ناوچەکە) دەستیان لێ نادرێت
           */
          object Fill {
              private fun lum(c: Int): Int = (Color.red(c) * 299 + Color.green(c) * 587 + Color.blue(c) * 114) / 1000

              private fun px(bmp: Bitmap, x: Int, y: Int): Int =
                  bmp.getPixel(x.coerceIn(0, bmp.width - 1), y.coerceIn(0, bmp.height - 1))

              private fun dev(c: Int, bg: Int): Int =
                  maxOf(abs(Color.red(c) - Color.red(bg)), abs(Color.green(c) - Color.green(bg)), abs(Color.blue(c) - Color.blue(bg)))

              private fun lerp(a: Int, b: Int, t: Float): Float = a + (b - a) * t

              private fun medAlong(arr: IntArray, i: Int): Int {
                  val lo = maxOf(0, i - 3)
                  val hi = minOf(arr.size - 1, i + 3)
                  val list = ArrayList<Int>()
                  for (k in lo..hi) list.add(arr[k])
                  list.sortBy { lum(it) }
                  return list[list.size / 2]
              }

              /** هەموو ناوچەی دەق (لەگەڵ بریقەکەی) دەسڕێتەوە و بە ڕەنگی لێوارەکانی دەوروبەر پڕی دەکاتەوە (گرادیەنت) */
              private fun boxFill(bmp: Bitmap, box: Rect): FillResult? {
                  return try {
                      val grow = maxOf(10, (box.height() * 0.22f).toInt())
                      val l = (box.left - grow).coerceIn(0, bmp.width - 2)
                      val t = (box.top - grow).coerceIn(0, bmp.height - 2)
                      val r = (box.right + grow).coerceIn(l + 2, bmp.width)
                      val b = (box.bottom + grow).coerceIn(t + 2, bmp.height)
                      val w = r - l
                      val h = b - t
                      if (w * h > 900000) return null
                      val d = 3
                      val topRaw = IntArray(w) { px(bmp, l + it, t - d) }
                      val botRaw = IntArray(w) { px(bmp, l + it, b + d - 1) }
                      val lefRaw = IntArray(h) { px(bmp, l - d, t + it) }
                      val rigRaw = IntArray(h) { px(bmp, r + d - 1, t + it) }
                      val top = IntArray(w) { medAlong(topRaw, it) }
                      val bot = IntArray(w) { medAlong(botRaw, it) }
                      val lef = IntArray(h) { medAlong(lefRaw, it) }
                      val rig = IntArray(h) { medAlong(rigRaw, it) }
                      val out = IntArray(w * h)
                      for (y in 0 until h) {
                          val ty = (y + 0.5f) / h
                          for (x in 0 until w) {
                              val tx = (x + 0.5f) / w
                              val vr = lerp(Color.red(top[x]), Color.red(bot[x]), ty)
                              val vg = lerp(Color.green(top[x]), Color.green(bot[x]), ty)
                              val vb = lerp(Color.blue(top[x]), Color.blue(bot[x]), ty)
                              val hr = lerp(Color.red(lef[y]), Color.red(rig[y]), tx)
                              val hg = lerp(Color.green(lef[y]), Color.green(rig[y]), tx)
                              val hb = lerp(Color.blue(lef[y]), Color.blue(rig[y]), tx)
                              out[y * w + x] = Color.rgb(((vr + hr) / 2).toInt(), ((vg + hg) / 2).toInt(), ((vb + hb) / 2).toInt())
                          }
                      }
                      FillResult(Bitmap.createBitmap(out, w, h, Bitmap.Config.ARGB_8888), Rect(l, t, r, b))
                  } catch (ex: Throwable) {
                      null
                  }
              }

              fun build(bmp: Bitmap, box: Rect): FillResult? {
                  return try {
                      val m = 6
                      val l = (box.left - m).coerceIn(0, bmp.width - 1)
                      val t = (box.top - m).coerceIn(0, bmp.height - 1)
                      val r = (box.right + m).coerceIn(l + 1, bmp.width)
                      val b = (box.bottom + m).coerceIn(t + 1, bmp.height)
                      val w = r - l
                      val h = b - t
                      if (w * h > 700000) return null

                      val src = IntArray(w * h)
                      bmp.getPixels(src, 0, w, l, t, w, h)

                      // ڕەنگی پشتەوە لە ڕینگی دەرەوەی ناوچەکە
                      val ring = ArrayList<Int>()
                      val d = 3
                      for (k in 0..11) {
                          val x = l + (r - l) * k / 11
                          val y = t + (b - t) * k / 11
                          ring.add(px(bmp, x, t - d)); ring.add(px(bmp, x, b + d))
                          ring.add(px(bmp, l - d, y)); ring.add(px(bmp, r + d, y))
                      }
                      ring.sortBy { lum(it) }
                      val bg = ring[ring.size / 2] or (0xFF shl 24)
                      val devs = ring.map { dev(it, bg) }.sorted()
                      val uniform = devs[(devs.size * 8) / 10] < 26

                      // ١) پیکسێلەکانی دەق
                      val thr = if (uniform) 30 else 40
                      val raw = BooleanArray(w * h)
                      for (i in src.indices) raw[i] = dev(src[i], bg) > thr

                      // ٢) ئەو پارچە پەیوەستانە لابەرە کە دەگەنە لێواری ناوچەکە (هێڵی بالۆن / وێنەی پشتەوە)
                      val label = IntArray(w * h)
                      val stack = IntArray(w * h)
                      var nextLabel = 0
                      val keepLabel = ArrayList<Boolean>()
                      for (start in 0 until w * h) {
                          if (!raw[start] || label[start] != 0) continue
                          nextLabel++
                          var sp = 0
                          stack[sp++] = start
                          label[start] = nextLabel
                          var touches = false
                          while (sp > 0) {
                              val p = stack[--sp]
                              val x = p % w
                              val y = p / w
                              if (x == 0 || y == 0 || x == w - 1 || y == h - 1) touches = true
                              if (x > 0 && raw[p - 1] && label[p - 1] == 0) { label[p - 1] = nextLabel; stack[sp++] = p - 1 }
                              if (x < w - 1 && raw[p + 1] && label[p + 1] == 0) { label[p + 1] = nextLabel; stack[sp++] = p + 1 }
                              if (y > 0 && raw[p - w] && label[p - w] == 0) { label[p - w] = nextLabel; stack[sp++] = p - w }
                              if (y < h - 1 && raw[p + w] && label[p + w] == 0) { label[p + w] = nextLabel; stack[sp++] = p + w }
                          }
                          keepLabel.add(touches)
                      }
                      val mask = BooleanArray(w * h)
                      for (i in 0 until w * h) {
                          val lb = label[i]
                          mask[i] = lb != 0 && !keepLabel[lb - 1]
                      }

                      // ٣) فراوانکردن بە ٣ پیکسێل بۆ سڕینەوەی لێوارە نەرمەکانی پیتەکان
                      val rad = 3
                      val tmp = BooleanArray(w * h)
                      for (y in 0 until h) for (x in 0 until w) {
                          var hit = false
                          var k = maxOf(0, x - rad)
                          val e = minOf(w - 1, x + rad)
                          while (k <= e) { if (mask[y * w + k]) { hit = true; break }; k++ }
                          tmp[y * w + x] = hit
                      }
                      for (y in 0 until h) for (x in 0 until w) {
                          var hit = false
                          var k = maxOf(0, y - rad)
                          val e = minOf(h - 1, y + rad)
                          while (k <= e) { if (tmp[k * w + x]) { hit = true; break }; k++ }
                          mask[y * w + x] = hit
                      }
                      // پیکسێلی هێڵی بالۆن/وێنەی پارێزراو هەرگیز نەسڕێتەوە
                      for (i in 0 until w * h) {
                          val lb = label[i]
                          if (lb != 0 && keepLabel[lb - 1]) mask[i] = false
                      }

                      // ئەگەر دەقەکە (بە تایبەت بریقەدار) بە لێوارەوە لکاوە و نەسڕاوەتەوە، هەموو سنووری دەقەکە بە ڕەنگی دەوروبەر پڕ دەکرێتەوە
                      run {
                          val bl = (box.left - l).coerceIn(0, w)
                          val bt = (box.top - t).coerceIn(0, h)
                          val br = (box.right - l).coerceIn(0, w)
                          val bb = (box.bottom - t).coerceIn(0, h)
                          var ink = 0
                          var gone = 0
                          for (yy in bt until bb) for (xx in bl until br) {
                              val p = yy * w + xx
                              if (raw[p]) {
                                  ink++
                                  if (mask[p]) gone++
                              }
                          }
                          if (ink > 30 && gone < ink * 0.6) return boxFill(bmp, box)
                      }

                      val out = src.copyOf()
                      if (uniform) {
                          for (i in 0 until w * h) if (mask[i]) out[i] = bg
                      } else {
                          // inpainting: پیکسێلی نەزانراو لە لێوارەوە بۆ ناوەڕاست بە تێکڕای دراوسێکانی پڕدەکرێتەوە
                          val known = BooleanArray(w * h) { !mask[it] }
                          var unknown = 0
                          for (i in 0 until w * h) if (mask[i]) unknown++
                          var pass = 0
                          val idxBuf = IntArray(w * h)
                          val colBuf = IntArray(w * h)
                          while (unknown > 0 && pass < 80) {
                              var cnt = 0
                              for (y in 0 until h) for (x in 0 until w) {
                                  val p = y * w + x
                                  if (known[p]) continue
                                  var sr = 0; var sg = 0; var sb = 0; var n = 0
                                  for (dy in -1..1) for (dx in -1..1) {
                                      if (dx == 0 && dy == 0) continue
                                      val xx = x + dx
                                      val yy = y + dy
                                      if (xx < 0 || yy < 0 || xx >= w || yy >= h) continue
                                      val q = yy * w + xx
                                      if (!known[q]) continue
                                      val c = out[q]
                                      sr += Color.red(c); sg += Color.green(c); sb += Color.blue(c); n++
                                  }
                                  if (n > 0) {
                                      idxBuf[cnt] = p
                                      colBuf[cnt] = Color.rgb(sr / n, sg / n, sb / n)
                                      cnt++
                                  }
                              }
                              if (cnt == 0) break
                              for (k in 0 until cnt) { out[idxBuf[k]] = colBuf[k]; known[idxBuf[k]] = true }
                              unknown -= cnt
                              pass++
                          }
                          if (unknown > 0) for (i in 0 until w * h) if (!known[i]) out[i] = bg
                          // نەرمکردنی ناوچە پڕکراوەکان بۆ ئەوەی بلۆک نەبینرێت
                          for (iter in 0 until 2) {
                              val cp = out.copyOf()
                              for (y in 0 until h) for (x in 0 until w) {
                                  val p = y * w + x
                                  if (!mask[p]) continue
                                  var sr = 0; var sg = 0; var sb = 0; var n = 0
                                  for (dy in -1..1) for (dx in -1..1) {
                                      val xx = x + dx
                                      val yy = y + dy
                                      if (xx < 0 || yy < 0 || xx >= w || yy >= h) continue
                                      val c = cp[yy * w + xx]
                                      sr += Color.red(c); sg += Color.green(c); sb += Color.blue(c); n++
                                  }
                                  out[p] = Color.rgb(sr / n, sg / n, sb / n)
                              }
                          }
                      }
                      for (i in out.indices) out[i] = out[i] or (0xFF shl 24)
                      FillResult(Bitmap.createBitmap(out, w, h, Bitmap.Config.ARGB_8888), Rect(l, t, r, b))
                  } catch (ex: Throwable) {
                      null
                  }
              }
          }

          /**
           * ئەو بلۆکە نزیکانە یەک دەکاتەوە کە ML Kit بە هەڵە دابەشی کردوون (هەمان بالۆن).
           * ئەمە ڕێگری دەکات لەوەی ڕیزی یەکەمی ئینگلیزی (وەک "WHAT MORE DO") بێ سڕینەوە بمێنێتەوە.
           */
          object Merge {
              class Item(val text: String, val box: Rect)

              private fun near(a: Rect, b: Rect): Boolean {
                  val lineH = minOf(a.height(), b.height()).coerceAtLeast(8)
                  val vGap = maxOf(a.top, b.top) - minOf(a.bottom, b.bottom)
                  val hOverlap = minOf(a.right, b.right) - maxOf(a.left, b.left)
                  val minW = minOf(a.width(), b.width()).coerceAtLeast(1)
                  return vGap < lineH * 0.7f && hOverlap > minW * 0.3f
              }

              fun run(items: List<Item>): List<Item> {
                  val list = items.sortedBy { it.box.top }.toMutableList()
                  var changed = true
                  while (changed) {
                      changed = false
                      outer@ for (i in 0 until list.size) {
                          for (j in i + 1 until list.size) {
                              val a = list[i]
                              val b = list[j]
                              if (!near(a.box, b.box)) continue
                              val first = if (a.box.top <= b.box.top) a else b
                              val second = if (first === a) b else a
                              val box = Rect(
                                  minOf(a.box.left, b.box.left), minOf(a.box.top, b.box.top),
                                  maxOf(a.box.right, b.box.right), maxOf(a.box.bottom, b.box.bottom)
                              )
                              list[i] = Item(first.text + " " + second.text, box)
                              list.removeAt(j)
                              changed = true
                              break@outer
                          }
                      }
                  }
                  return list
              }
          }

          /** فۆنتی کوردیی ئەستوور (Noto Kufi Arabic) ئەگەر دابەزێنرابێت، ئەگینا فۆنتی سیستەم */
          object Fonts {
              @Volatile private var tf: Typeface? = null
              @Volatile var custom = false

              fun get(ctx: Context): Typeface {
                  tf?.let { return it }
                  val t = try {
                      val f = Typeface.createFromAsset(ctx.assets, "kfont.ttf")
                      custom = true
                      f
                  } catch (e: Throwable) {
                      Typeface.DEFAULT_BOLD
                  }
                  tf = t
                  return t
              }
          }

          /** دروستکردنی دەقی ئۆڤەرلەی جوان: سێبەر بۆ خوێندنەوەی ڕوون، ئەنیمەیشنی نەرم */
          object Overlay {
              private fun lum(c: Int): Int = (Color.red(c) * 299 + Color.green(c) * 587 + Color.blue(c) * 114) / 1000

              fun make(
                  ctx: Context, text: String, bg: Int, fill: Bitmap?, animate: Boolean, inset: IntArray? = null,
                  textColor: Int? = null, glow: Int? = null
              ): TextView {
                  val tv = TextView(ctx)
                  tv.setAutoSizeTextTypeUniformWithConfiguration(6, 30, 1, TypedValue.COMPLEX_UNIT_SP)
                  tv.text = text
                  val darkText = lum(bg) > 150
                  if (textColor != null) {
                      // ڕەنگی ڕەسەنی دەق (سوور، شین، بریقەدار...) دەپارێزرێت
                      tv.setTextColor(textColor)
                      if (glow != null) {
                          tv.setShadowLayer(20f, 0f, 0f, glow)
                      } else {
                          tv.setShadowLayer(4f, 0f, 0f, if (lum(textColor) > 140) Color.BLACK else Color.WHITE)
                      }
                  } else {
                      tv.setTextColor(if (darkText) Color.BLACK else Color.WHITE)
                      tv.setShadowLayer(4f, 0f, 0f, if (darkText) Color.WHITE else Color.BLACK)
                  }
                  tv.typeface = Fonts.get(ctx)
                  if (Fonts.custom) {
                      try { tv.setFontVariationSettings("'wght' 850") } catch (_: Throwable) { }
                  }
                  tv.gravity = Gravity.CENTER
                  tv.textDirection = View.TEXT_DIRECTION_RTL
                  tv.includeFontPadding = false
                  tv.setLineSpacing(0f, 1.05f)
                  tv.setPadding(6, 3, 6, 3)
                  if (fill != null) {
                      val bd = BitmapDrawable(ctx.resources, fill)
                      bd.setFilterBitmap(true)
                      // پڕکردنەوەکە تەنها شوێنی دەقە ئینگلیزییەکە دادەپۆشێت، ناوچەی دەوروبەر وەک خۆی دەمێنێتەوە
                      tv.background = if (inset != null) InsetDrawable(bd, inset[0], inset[1], inset[2], inset[3]) else bd
                  } else {
                      val shape = GradientDrawable()
                      shape.setColor(bg)
                      shape.cornerRadius = 14f
                      tv.background = shape
                  }
                  if (animate) {
                      tv.alpha = 0f
                      tv.animate().alpha(1f).setDuration(140).start()
                  }
                  return tv
              }

              /** گۆڕینی دەق بە نەرمی کاتێک Gemini دەگات */
              fun swap(tv: TextView, text: String) {
                  if (tv.text.toString() == text) return
                  tv.animate().alpha(0.35f).setDuration(70).withEndAction {
                      tv.text = text
                      tv.animate().alpha(1f).setDuration(110).start()
                  }.start()
              }
          }


          /** ڕەنگ و شێوازی دەقی ڕەسەن دەدۆزێتەوە: سوور، شین، بریقەدار (glow). glow = ڕەنگی بریقەکە */
          object Style {
              class Res(val color: Int?, val glow: Int?)

              private fun lum(c: Int): Int = (Color.red(c) * 299 + Color.green(c) * 587 + Color.blue(c) * 114) / 1000

              private fun sat(c: Int): Float {
                  val mx = maxOf(Color.red(c), Color.green(c), Color.blue(c))
                  val mn = minOf(Color.red(c), Color.green(c), Color.blue(c))
                  return if (mx == 0) 0f else (mx - mn).toFloat() / mx
              }

              private fun avg(list: List<Int>, from: Int, to: Int): Int {
                  var rr = 0
                  var gg = 0
                  var bb = 0
                  val n = maxOf(1, to - from)
                  for (i in from until to) {
                      rr += Color.red(list[i]); gg += Color.green(list[i]); bb += Color.blue(list[i])
                  }
                  return Color.rgb(rr / n, gg / n, bb / n)
              }

              fun detect(bmp: Bitmap, box: Rect, bg: Int): Res {
                  return try {
                      val l = box.left.coerceIn(0, bmp.width - 1)
                      val t = box.top.coerceIn(0, bmp.height - 1)
                      val r = box.right.coerceIn(l + 1, bmp.width)
                      val b = box.bottom.coerceIn(t + 1, bmp.height)
                      val stepX = maxOf(1, (r - l) / 70)
                      val stepY = maxOf(1, (b - t) / 45)
                      val ink = ArrayList<Int>()
                      val haloPx = ArrayList<Int>()
                      var total = 0
                      var y = t
                      while (y < b) {
                          var x = l
                          while (x < r) {
                              val c = bmp.getPixel(x, y)
                              total++
                              val d = maxOf(
                                  abs(Color.red(c) - Color.red(bg)),
                                  abs(Color.green(c) - Color.green(bg)),
                                  abs(Color.blue(c) - Color.blue(bg))
                              )
                              if (d > 70) ink.add(c) else if (d > 28) haloPx.add(c)
                              x += stepX
                          }
                          y += stepY
                      }
                      if (total == 0 || ink.size < total * 0.03) return Res(null, null)

                      val byLum = ink.sortedByDescending { lum(it) }
                      val core = avg(byLum, 0, maxOf(1, byLum.size / 4))
                      val bySat = ink.sortedByDescending { sat(it) }
                      val colored = avg(bySat, 0, maxOf(1, bySat.size * 35 / 100))

                      if (lum(bg) < 100 && lum(core) > 150 && haloPx.size > total * 0.08) {
                          val hs = haloPx.sortedByDescending { sat(it) }
                          val gc = avg(hs, 0, maxOf(1, hs.size * 40 / 100))
                          if (sat(gc) > 0.2f) return Res(core, gc)
                      }
                      if (sat(colored) >= 0.3f) Res(colored, null) else Res(null, null)
                  } catch (e: Throwable) {
                      Res(null, null)
                  }
              }
          }
          KMEOF
          mkdir -p $(dirname app/src/main/java/com/kurdish/manhwareal/Chapter.kt)
          cat > app/src/main/java/com/kurdish/manhwareal/Chapter.kt <<'KMEOF'
          package com.kurdish.manhwareal

          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.BitmapRegionDecoder
          import android.graphics.Color
          import android.graphics.Rect
          import android.widget.TextView
          import com.google.android.gms.tasks.Tasks
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.text.TextRecognizer
          import android.widget.Toast
          import org.json.JSONArray
          import org.json.JSONObject
          import java.util.concurrent.Callable
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.concurrent.ExecutorService
          import java.util.concurrent.Executors
          import java.util.concurrent.TimeUnit

          /** یەک دەقی دۆزراوە لەسەر چاپتەر. هەموو ژمارەکان بە پیکسێلی WebView ـن (ناوەڕۆکی لاپەڕە، نەک شاشە) */
          class ChItem(
              val text: String,
              val px: Int,
              val py: Int,
              val w: Int,
              val h: Int,
              val bg: Int,
              val fill: Bitmap?,
              val inset: IntArray?,
              val textColor: Int? = null,
              val glow: Int? = null
          ) {
              var tr: String? = null
              var gem = false
              var view: TextView? = null
          }

          /**
           * وەرگێڕانی هەموو چاپتەر بە یەک جار:
           *  وێنەکان هاوکات دادەبەزێنرێن، OCR دەکرێن، Google یەکسەر دەقی خێرا دەدات،
           *  Gemini بە دەستە-دەستە دەقی مرۆڤانە دەدات و جێگەی دەگرێتەوە.
           */
          object Chapter {
              class Img(val src: String, val x: Float, val y: Float, val w: Float, val h: Float)

              private const val TILE = 1700
              private const val OVER = 140

              val workers: ExecutorService = Executors.newFixedThreadPool(4)
              private val gPool: ExecutorService = Executors.newFixedThreadPool(8)
              private val aiPool: ExecutorService = Executors.newFixedThreadPool(4)

              fun google(text: String, cb: (String?) -> Unit) {
                  gPool.execute { cb(Fast.google(text)) }
              }

              fun gemini(texts: List<String>, cb: (List<String>?) -> Unit) {
                  aiPool.execute {
                      var r = Fast.ai(texts)
                      if (r == null) {
                          try { Thread.sleep(700) } catch (_: InterruptedException) { }
                          r = Fast.ai(texts)
                      }
                      cb(r)
                  }
              }

              fun fetch(url: String, referer: String, ua: String, cookie: String?): ByteArray? {
                  for (attempt in 0..1) {
                      var conn: HttpURLConnection? = null
                      try {
                          conn = URL(url).openConnection() as HttpURLConnection
                          conn.connectTimeout = 6000
                          conn.readTimeout = 12000
                          conn.instanceFollowRedirects = true
                          conn.setRequestProperty("User-Agent", ua)
                          if (referer.isNotEmpty()) conn.setRequestProperty("Referer", referer)
                          conn.setRequestProperty("Accept", "image/webp,image/jpeg,image/png,image/*;q=0.8")
                          if (!cookie.isNullOrEmpty()) conn.setRequestProperty("Cookie", cookie)
                          if (conn.responseCode in 200..299) {
                              val b = conn.inputStream.use { it.readBytes() }
                              if (b.size > 2000) return b
                          }
                      } catch (e: Exception) {
                          // دووبارە هەوڵ دەدرێتەوە
                      } finally {
                          try { conn?.disconnect() } catch (_: Exception) { }
                      }
                  }
                  return null
              }

              private fun lum(c: Int): Int = (Color.red(c) * 299 + Color.green(c) * 587 + Color.blue(c) * 114) / 1000

              private fun sampleBg(bmp: Bitmap, r: Rect): Int {
                  val cx = (r.left + r.right) / 2
                  val cy = (r.top + r.bottom) / 2
                  val m = 6
                  val pts = listOf(
                      (r.left - m) to (r.top - m), cx to (r.top - m), (r.right + m) to (r.top - m),
                      (r.left - m) to cy, (r.right + m) to cy,
                      (r.left - m) to (r.bottom + m), cx to (r.bottom + m), (r.right + m) to (r.bottom + m)
                  )
                  val cols = ArrayList<Int>()
                  for ((x, y) in pts) {
                      if (x in 0 until bmp.width && y in 0 until bmp.height) cols.add(bmp.getPixel(x, y))
                  }
                  if (cols.isEmpty()) return Color.WHITE
                  cols.sortBy { lum(it) }
                  return cols[cols.size / 2] or (0xFF shl 24)
              }

              /** یەک وێنەی چاپتەر: دەبڕدرێت بە پارچە (tile) ـی بچووک، هەر پارچەیەک OCR دەکرێت */
              fun ocr(rec: TextRecognizer, bytes: ByteArray, img: Img, ratio: Float): List<ChItem> {
                  val bo = BitmapFactory.Options()
                  bo.inJustDecodeBounds = true
                  BitmapFactory.decodeByteArray(bytes, 0, bytes.size, bo)
                  val sw = bo.outWidth
                  val sh = bo.outHeight
                  if (sw <= 0 || sh <= 0) return emptyList()

                  var sample = 1
                  while (sw / (sample * 2) >= 700) sample *= 2
                  val fx = img.w / sw
                  val fy = img.h / sh
                  val tileSrc = TILE * sample
                  val overSrc = OVER * sample

                  val decoder = try {
                      BitmapRegionDecoder.newInstance(bytes, 0, bytes.size, false)
                  } catch (e: Throwable) {
                      null
                  }
                  var whole: Bitmap? = null
                  if (decoder == null) {
                      val o = BitmapFactory.Options()
                      o.inSampleSize = sample
                      val w0 = try {
                          BitmapFactory.decodeByteArray(bytes, 0, bytes.size, o)
                      } catch (e: Throwable) {
                          null
                      }
                      if (w0 == null) return emptyList()
                      whole = w0
                  }

                  val out = ArrayList<ChItem>()
                  var k0 = 0
                  while (k0 < sh && out.size < 60) {
                      val k1 = minOf(k0 + tileSrc, sh)
                      val rs = maxOf(0, k0 - overSrc)
                      val re = minOf(sh, k1 + overSrc)
                      val tile: Bitmap? = try {
                          if (decoder != null) {
                              val o = BitmapFactory.Options()
                              o.inSampleSize = sample
                              decoder.decodeRegion(Rect(0, rs, sw, re), o)
                          } else {
                              val wb = whole!!
                              val ty = rs / sample
                              val th = minOf(wb.height - ty, (re - rs) / sample)
                              if (th > 8) Bitmap.createBitmap(wb, 0, ty, wb.width, th) else null
                          }
                      } catch (e: Throwable) {
                          null
                      }
                      if (tile != null) {
                          try {
                              out.addAll(tileBlocks(rec, tile, rs, k0, k1, sample, fx, fy, img, ratio))
                          } catch (e: Throwable) {
                              // ئەم پارچەیە تێپەڕ دەکرێت
                          }
                          try { tile.recycle() } catch (_: Throwable) { }
                      }
                      k0 = k1
                  }
                  try { decoder?.recycle() } catch (_: Throwable) { }
                  try { whole?.recycle() } catch (_: Throwable) { }
                  return out
              }

              private fun tileBlocks(
                  rec: TextRecognizer, tile: Bitmap, rs: Int, k0: Int, k1: Int,
                  sample: Int, fx: Float, fy: Float, img: Img, ratio: Float
              ): List<ChItem> {
                  val vt = Tasks.await(rec.process(InputImage.fromBitmap(tile, 0)), 25, TimeUnit.SECONDS)
                  val raw = ArrayList<Merge.Item>()
                  for (b in vt.textBlocks) {
                      val box = b.boundingBox ?: continue
                      val t = b.text.replace("\n", " ").trim()
                      val nonSpace = t.count { !it.isWhitespace() }
                      if (nonSpace < 3 || t.count { it.isLetter() } < 2) continue
                      if (t.count { it.isLetter() }.toFloat() / nonSpace < 0.6f) continue
                      raw.add(Merge.Item(t, Rect(box)))
                  }

                  fun vx(bx: Int): Float = (img.x + bx * sample * fx) * ratio
                  fun vy(by: Int): Float = (img.y + (rs + by * sample) * fy) * ratio

                  val imgL = img.x * ratio
                  val imgR = (img.x + img.w) * ratio
                  val imgT = img.y * ratio
                  val imgB = (img.y + img.h) * ratio

                  val res = ArrayList<ChItem>()
                  for (item in Merge.run(raw)) {
                      val box = item.box
                      val centerSrc = rs + ((box.top + box.bottom) / 2) * sample
                      if (centerSrc < k0 || centerSrc >= k1) continue // ئەم دەقە لە پارچەی دراوسێدا دەگیرێت

                      val bl = vx(box.left)
                      val bt = vy(box.top)
                      val br = vx(box.right)
                      val bb = vy(box.bottom)
                      val padX = (br - bl) * 0.12f + 10f
                      val padY = (bb - bt) * 0.14f + 8f
                      var left = maxOf(bl - padX, imgL).toInt()
                      var top = maxOf(bt - padY, imgT).toInt()
                      var right = minOf(br + padX, imgR).toInt()
                      var bottom = minOf(bb + padY, imgB).toInt()
                      if (right - left < 12 || bottom - top < 12) continue

                      val fr = Fill.build(tile, box)
                      if (fr != null) {
                          left = minOf(left, maxOf(vx(fr.rect.left), imgL).toInt())
                          top = minOf(top, maxOf(vy(fr.rect.top), imgT).toInt())
                          right = maxOf(right, minOf(vx(fr.rect.right), imgR).toInt())
                          bottom = maxOf(bottom, minOf(vy(fr.rect.bottom), imgB).toInt())
                      }
                      var inset: IntArray? = null
                      if (fr != null) {
                          inset = intArrayOf(
                              (vx(fr.rect.left).toInt() - left).coerceAtLeast(0),
                              (vy(fr.rect.top).toInt() - top).coerceAtLeast(0),
                              (right - vx(fr.rect.right).toInt()).coerceAtLeast(0),
                              (bottom - vy(fr.rect.bottom).toInt()).coerceAtLeast(0)
                          )
                      }
                      val bgc = sampleBg(tile, box)
                      val st = Style.detect(tile, box, bgc)
                      res.add(ChItem(item.text, left, top, right - left, bottom - top, bgc, fr?.bmp, inset, st.color, st.glow))
                  }
                  return res
              }
          }

          /**
           * چەند زیرەکی دەستکرد پێکەوە: هەر مۆدێلێک جیا وەردەگێڕێت، پاشان «سەرنووسەر» باشترینیان هەڵدەبژێرێت و چاکی دەکات.
           * هەموو داواکارییەکان بە Worker ـەکەتدا دەچن (/llm) و کلیلەکان تەنها لەوێن.
           */
          object Ensemble {
              private val dead = java.util.concurrent.ConcurrentHashMap.newKeySet<String>()
              private val order = listOf("claude", "openai", "deepseek")
              private val outer: ExecutorService = Executors.newFixedThreadPool(3)
              private val inner: ExecutorService = Executors.newFixedThreadPool(8)

              fun anyAlive(): Boolean = order.any { !dead.contains(it) }

              private fun llm(provider: String, prompt: String): String? {
                  if (dead.contains(provider)) return null
                  return try {
                      val body = JSONObject().put("provider", provider).put("prompt", prompt).toString()
                      val resp = Net.authedPost(Secrets.PROXY.trimEnd('/') + "/llm", body)
                      val t = JSONObject(resp).optString("text", "")
                      if (t.isEmpty()) null else t
                  } catch (e: Exception) {
                      val m = e.message ?: ""
                      if (m.contains("HTTP 501") || m.contains("HTTP 404")) dead.add(provider)
                      null
                  }
              }

              private fun parse(text: String?, n: Int): List<String>? {
                  if (text == null) return null
                  val st = text.indexOf('[')
                  val en = text.lastIndexOf(']')
                  if (st < 0 || en <= st) return null
                  return try {
                      val a = JSONArray(text.substring(st, en + 1))
                      if (a.length() != n) null else List(n) { Fast.noLatin(a.optString(it, "")) }
                  } catch (e: Exception) {
                      null
                  }
              }

              private fun judgePrompt(cands: String): String =
                  "You are the chief Kurdish Sorani (Central Kurdish, Arabic script) editor of a professional manhwa localization team. " +
                      "Below is a JSON array. Each item has: en = English source line (read by OCR, may contain small OCR mistakes), " +
                      "and candidate translations a, b, c... made by different translators.\n" +
                      "YOUR JOB for every item: pick the most accurate and most natural candidate, or merge the best parts of several, " +
                      "and fix any grammar, spelling, verb conjugation, pronoun suffix or unnatural word order. The final line must sound exactly " +
                      "like a native Kurdish speaker talking, keep the emotion (anger, fear, sarcasm, respect), keep it short enough for a speech bubble.\n" +
                      "RULES: (1) Kurdish Sorani Arabic script only, Kurdish letters (ە ێ ۆ ڕ ڵ ک ی), NEVER any Latin letter - transliterate names and sound effects. " +
                      "(2) Keep character names consistent. (3) If en is a watermark, website name or garbage return an empty string. " +
                      "(4) Return ONLY a JSON array of exactly the same number of strings, same order, no commentary.\n" + cands

              fun refine(texts: List<String>, draft: List<String>?, cb: (List<String>?) -> Unit) {
                  outer.execute {
                      try {
                          val n = texts.size
                          val prompt = Fast.buildPrompt(texts)
                          val futures = order.filter { !dead.contains(it) }
                              .map { p -> inner.submit(Callable<List<String>?> { parse(llm(p, prompt), n) }) }
                          val cands = ArrayList<List<String>>()
                          if (draft != null && draft.size == n) cands.add(draft)
                          for (f in futures) {
                              try {
                                  val r = f.get(45, TimeUnit.SECONDS)
                                  if (r != null) cands.add(r)
                              } catch (e: Exception) { }
                          }
                          if (cands.isEmpty()) {
                              cb(null)
                              return@execute
                          }
                          if (cands.size == 1) {
                              cb(cands[0])
                              return@execute
                          }
                          val arr = JSONArray()
                          for (i in 0 until n) {
                              val o = JSONObject().put("en", texts[i])
                              for ((k, cd) in cands.withIndex()) o.put(('a' + k).toString(), cd[i])
                              arr.put(o)
                          }
                          val jp = judgePrompt(arr.toString())
                          var out: List<String>? = null
                          for (p in listOf("claude", "openai")) {
                              if (out == null && !dead.contains(p)) out = parse(llm(p, jp), n)
                          }
                          if (out == null) {
                              out = try {
                                  val resp = Net.callGemini(Fast.geminiBody(jp, true))
                                  val text = JSONObject(resp).getJSONArray("candidates").getJSONObject(0)
                                      .getJSONObject("content").getJSONArray("parts").getJSONObject(0).getString("text")
                                  parse(text, n)
                              } catch (e: Exception) {
                                  null
                              }
                          }
                          cb(out ?: cands[0])
                      } catch (e: Throwable) {
                          cb(null)
                      }
                  }
              }
          }
