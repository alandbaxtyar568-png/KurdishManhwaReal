                  col.addView(header, LinearLayout.LayoutParams(MATCH, WRAP))

                  val searchRow = LinearLayout(this)
                  searchRow.orientation = LinearLayout.HORIZONTAL
                  searchRow.setPadding(dp(16), dp(4), dp(16), dp(4))
                  searchEt = Ui.edit(this, "ناوی مانهوایەک بگەڕێ...")
                  searchEt.isSingleLine = true
                  searchEt.imeOptions = EditorInfo.IME_ACTION_SEARCH
                  searchEt.setOnEditorActionListener { _, actionId, _ ->
                      if (actionId == EditorInfo.IME_ACTION_SEARCH) {
                          hideKeyboard()
                          reload()
                          true
                      } else {
                          false
                      }
                  }
                  searchRow.addView(searchEt, LinearLayout.LayoutParams(0, WRAP, 1f))
                  val goBtn = Ui.button(this, "گەڕان", false) {
                      hideKeyboard()
                      reload()
                  }
                  val glp = LinearLayout.LayoutParams(WRAP, WRAP)
