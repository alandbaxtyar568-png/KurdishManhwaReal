                  discoverRv.setPadding(dp(6), dp(4), dp(6), dp(12))
                  discoverAdapter = CardAdapter(this, ArrayList(), true,
                      { m -> openDetail(m) }, { m -> onHeart(m) }, { m -> onHide(m) })
                  discoverRv.adapter = discoverAdapter
                  discoverRv.addOnScrollListener(object : RecyclerView.OnScrollListener() {
                      override fun onScrolled(rv: RecyclerView, dx: Int, dy: Int) {
                          if (dy > 0 && !loading && hasMore && !customList) {
                              val lm = rv.layoutManager as GridLayoutManager
                              if (lm.findLastVisibleItemPosition() >= discoverAdapter.itemCount - 4) loadPage()
                          }
                      }
                  })
