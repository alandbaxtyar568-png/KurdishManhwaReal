                          stylePill(chip, selectedGenres.contains(g.first))
                          reload()
                      }
                      val lp = LinearLayout.LayoutParams(WRAP, WRAP)
                      lp.marginEnd = dp(8)
                      genreRow.addView(chip, lp)
                      genreChips[g.first] = chip
                  }
