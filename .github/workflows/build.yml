                          try { Net.findByTitle(w.first) } catch (ex: Exception) { null }
                      })
                  }
                  val out = ArrayList<Manhwa>()
                  val seen = HashSet<Int>()
                  for ((i, f) in futures.withIndex()) {
                      val m: Manhwa? = try { f.get() } catch (ex: Exception) { null }
                      if (m != null && seen.add(m.id)) {
                          m.reason = wanted[i].second
                          out.add(m)
                      }
                  }
                  return out
              }
          }

          /**
           * وێبی ناو ئەپەکە + وەرگێڕانی ڕاستەوخۆ.
           * Google یەکسەر دەردەکەوێت و Gemini پاشان دەقە مرۆڤانەکە دەگۆڕێتەوە.
           */
          class WebTab(private val act: Activity) {

              private class Block(
                  val text: String, val rect: Rect, val bg: Int, val fill: Bitmap? = null, val core: Rect? = null,
                  val textColor: Int? = null, val glow: Int? = null
              )

              val root = LinearLayout(act)
              private val web = WebView(act)
              private val overlay = FrameLayout(act)
              private val bar = View(act)
              private val topBars = LinearLayout(act)
              private lateinit var urlEt: EditText
              private lateinit var trBtn: TextView
              private lateinit var chBtn: TextView
              private lateinit var polBtn: TextView
              private var chPolish = false
              private val chOverlay = FrameLayout(act)
              private val chItems = ArrayList<ChItem>()
              private val chPending = ArrayList<ChItem>()
              private var chGen = 0
              private var chState = 0 // 0 ئامادە، 1 کار دەکات، 2 تەواو بوو
              private var chImgTotal = 0
              private var chImgDone = 0
              private var chGemOut = 0
              private var chGemDone = 0
              private lateinit var exitBtn: TextView

              var onFullscreen: ((Boolean) -> Unit)? = null

              private val handler = Handler(Looper.getMainLooper())
              private val recognizer by lazy { TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS) }
              private val ocrRunnable = Runnable { runOcr() }
              private val hideExit = Runnable { exitBtn.visibility = View.GONE }
              private var tapX = 0f
              private var tapY = 0f
              private var tapT = 0L

              private var translating = false
              private var fullscreen = false
              private var busy = false
              private var loaded = false
              private var navGen = 0
              private var lastOcr = 0L

              private fun dp(v: Int): Int = Ui.dp(act, v)

              init {
                  build()
                  setup()
              }

              private fun build() {
                  root.orientation = LinearLayout.VERTICAL
                  topBars.orientation = LinearLayout.VERTICAL

                  val top = LinearLayout(act)
                  top.orientation = LinearLayout.HORIZONTAL
                  top.layoutDirection = View.LAYOUT_DIRECTION_LTR
                  top.gravity = Gravity.CENTER_VERTICAL
                  top.setPadding(dp(10), dp(8), dp(10), dp(4))

                  val backBtn = Ui.button(act, "←", false) { if (web.canGoBack()) web.goBack() }
                  top.addView(backBtn, LinearLayout.LayoutParams(WW, WW))

                  urlEt = Ui.edit(act, "ناونیشان یان گەڕان...")
                  urlEt.isSingleLine = true
                  urlEt.textDirection = View.TEXT_DIRECTION_LTR
                  urlEt.inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_URI
                  urlEt.imeOptions = EditorInfo.IME_ACTION_GO
                  urlEt.setOnEditorActionListener { _, actionId, _ ->
                      if (actionId == EditorInfo.IME_ACTION_GO) {
                          open(urlEt.text.toString())
                          true
                      } else {
                          false
                      }
                  }
                  val ulp = LinearLayout.LayoutParams(0, WW, 1f)
                  ulp.marginStart = dp(6)
                  ulp.marginEnd = dp(6)
                  top.addView(urlEt, ulp)

                  val go = Ui.button(act, "→", true) { open(urlEt.text.toString()) }
                  top.addView(go, LinearLayout.LayoutParams(WW, WW))
                  topBars.addView(top, LinearLayout.LayoutParams(WM, WW))

                  val scroll = HorizontalScrollView(act)
                  scroll.isHorizontalScrollBarEnabled = false
                  val row = LinearLayout(act)
                  row.orientation = LinearLayout.HORIZONTAL
                  row.layoutDirection = View.LAYOUT_DIRECTION_RTL
                  row.setPadding(dp(10), dp(2), dp(10), dp(6))

                  trBtn = Ui.button(act, "", false) { toggle() }
                  val tlp = LinearLayout.LayoutParams(WW, WW)
                  tlp.marginEnd = dp(8)
                  row.addView(trBtn, tlp)

                  chBtn = Ui.button(act, "", false) { chToggle() }
                  val clp0 = LinearLayout.LayoutParams(WW, WW)
                  clp0.marginEnd = dp(8)
                  row.addView(chBtn, clp0)
                  styleCh("⚡ هەموو چاپتەر", false)

                  val prefs = act.getSharedPreferences("km_ui", Context.MODE_PRIVATE)
                  chPolish = prefs.getBoolean("polish", false)
                  polBtn = Ui.button(act, "", false) {
                      chPolish = !chPolish
                      prefs.edit().putBoolean("polish", chPolish).apply()
                      styleP()
                  }
                  val plp = LinearLayout.LayoutParams(WW, WW)
                  plp.marginEnd = dp(8)
                  row.addView(polBtn, plp)
                  styleP()

                  val fsBtn = Ui.button(act, "⛶ تەواوی شاشە", false) { setFullscreen(true) }
                  val flp = LinearLayout.LayoutParams(WW, WW)
                  flp.marginEnd = dp(8)
                  row.addView(fsBtn, flp)

                  val reload = Ui.button(act, "⟳", false) { web.reload() }
                  val rlp = LinearLayout.LayoutParams(WW, WW)
                  rlp.marginEnd = dp(8)
                  row.addView(reload, rlp)

                  val sites = listOf(
                      "Asura Scans" to "https://asurascans.com",
                      "Webtoon" to "https://www.webtoons.com",
                      "AniList" to "https://anilist.co",
                      "Google" to "https://www.google.com"
                  )
                  for (s in sites) {
                      val chip = Ui.button(act, s.first, false) { open(s.second) }
                      val clp = LinearLayout.LayoutParams(WW, WW)
                      clp.marginEnd = dp(8)
