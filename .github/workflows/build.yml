              private fun buildDiscover(): LinearLayout {
                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL

                  val header = LinearLayout(this)
                  header.orientation = LinearLayout.HORIZONTAL
                  header.gravity = Gravity.CENTER_VERTICAL
                  header.setPadding(dp(16), dp(12), dp(16), dp(6))
                  val logo = ImageView(this)
                  logo.setImageResource(R.drawable.ic_launcher_foreground)
                  header.addView(logo, LinearLayout.LayoutParams(dp(52), dp(52)))
                  val titles = LinearLayout(this)
                  titles.orientation = LinearLayout.VERTICAL
                  titles.addView(Ui.tv(this, "دۆزینەوەی مانهوا", 20f, Ui.TEXT, true))
                  titles.addView(Ui.tv(this, "AI ـی خۆت بۆ باشترین مانهواکان", 12f, Ui.MUTED))
                  val tlp = LinearLayout.LayoutParams(0, WRAP, 1f)
