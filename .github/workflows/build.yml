              }

              private fun fetch(q: String, genres: List<String>, md: Int, pg: Int): List<Manhwa> {
                  if (q.isNotEmpty()) return Net.discover("SEARCH_MATCH", genres, q, "", pg, 24, 0, 0)
                  return when (md) {
                      0 -> {
                          val g = if (genres.isNotEmpty()) genres else Store.topTasteGenres(3)
                          val list = Net.discover("SCORE_DESC", g, "", "", pg, 40, 70, 4000)
                          list.sortedByDescending { it.score / 100.0 + 0.15 * Store.affinityNorm(it) }
                      }
                      1 -> Net.discover("SCORE_DESC", genres, "", "", pg, 24, 75, 10000)
                      2 -> Net.discover("TRENDING_DESC", genres, "", "", pg, 24, 0, 0)
                      else -> Net.discover("POPULARITY_DESC", genres, "", "RELEASING", pg, 24, 0, 0)
                  }
              }

              private fun loadPage() {
                  if (loading) return
                  loading = true
                  val token = requestToken
                  val q = searchEt.text.toString().trim()
                  val genres = selectedGenres.toList()
                  val curPage = page
                  val curMode = mode
                  if (curPage == 1) statusTv.text = "لە دۆزینەوەدایە..."
                  Net.async(
                      { fetch(q, genres, curMode, curPage) },
                      { list ->
                          if (token == requestToken) {
                              loading = false
                              applyResults(list, curPage, curMode, q)
                          }
                      },
                      { err ->
                          if (token == requestToken) {
                              loading = false
                              statusTv.text = "هەڵە: " + err
                          }
                      }
                  )
              }

              private fun applyResults(list: List<Manhwa>, pg: Int, md: Int, q: String) {
                  val hidden = Store.hiddenIds()
                  val existing = HashSet<Int>()
                  for (it in discoverAdapter.items) existing.add(it.id)
                  val add = list.filter { !hidden.contains(it.id) && !existing.contains(it.id) }
                  val start = discoverAdapter.items.size
                  discoverAdapter.items.addAll(add)
                  discoverAdapter.notifyItemRangeInserted(start, add.size)
                  hasMore = list.size >= 10
                  page = pg + 1
                  statusTv.text = when {
                      discoverAdapter.items.isEmpty() -> "هیچ ئەنجامێک نەدۆزرایەوە"
                      q.isEmpty() && md == 0 && !Store.hasTaste() -> "✦ چەند مانهوایەک پاشەکەوت بکە ♥ تا AI تامەکەت بناسێت"
                      q.isEmpty() && md == 0 -> "✦ هەڵبژێردراوە بەپێی تامی تۆ"
                      else -> discoverAdapter.items.size.toString() + " مانهوا"
                  }
              }

              private fun showCustom(list: List<Manhwa>, label: String) {
                  requestToken++
                  loading = false
                  customList = true
                  hasMore = false
                  val hidden = Store.hiddenIds()
                  discoverAdapter.items.clear()
                  discoverAdapter.items.addAll(list.filter { !hidden.contains(it.id) })
                  discoverAdapter.notifyDataSetChanged()
                  statusTv.text = label
                  selectTab(0)
                  discoverRv.scrollToPosition(0)
              }

              private fun onHeart(m: Manhwa) {
                  val now = Store.toggleSave(m)
                  discoverAdapter.notifyDataSetChanged()
                  refreshSaved()
                  toast(if (now) "زیادکرا بۆ پاشەکەوتکراوەکان ♥" else "لابرا لە پاشەکەوتکراوەکان")
              }

              private fun onHide(m: Manhwa) {
                  Store.hide(m)
