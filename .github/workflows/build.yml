name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Create project files
        run: |
          mkdir -p $(dirname settings.gradle)
          cat > settings.gradle <<'KMEOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          KMEOF
          mkdir -p $(dirname app/build.gradle)
          cat > app/build.gradle <<'KMEOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.kurdish.manhwareal'
              compileSdk 35

              defaultConfig {
                  applicationId "com.kurdish.manhwareal"
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'

              // ML Kit - Latin text recognition (English)
              implementation 'com.google.mlkit:text-recognition:16.0.0'
          }
          KMEOF
          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml <<'KMEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="Kurdish Manhwa Real"
                  android:supportsRtl="true"
                      for (i in 0 until arr.length()) list.add(Manhwa.fromJson(arr.getJSONObject(i)))
                  } catch (_: Exception) { }
                  savedCache = list
                  return list
              }

              private fun writeSaved(list: List<Manhwa>) {
                  val arr = JSONArray()
                  for (m in list) arr.put(m.toJson())
                  p().edit().putString("saved", arr.toString()).apply()
              }

              fun isSaved(id: Int): Boolean = saved().any { it.id == id }

              /** true = زیادکرا، false = لابرا */
              fun toggleSave(m: Manhwa): Boolean {
                  val list = saved()
                  val idx = list.indexOfFirst { it.id == m.id }
                  return if (idx >= 0) {
                      list.removeAt(idx)
                      writeSaved(list)
                      addTaste(m, -1.0)
                      false
                  } else {
                      list.add(0, m)
                      writeSaved(list)
                      addTaste(m, 1.0)
                      true
                  }
              }

              fun hiddenIds(): Set<Int> {
                  val s = p().getStringSet("hid_ids", emptySet()) ?: emptySet()
                  return s.mapNotNull { it.toIntOrNull() }.toSet()
              }

              fun hiddenTitles(): List<String> {
                  val s = p().getStringSet("hid_titles", emptySet()) ?: emptySet()
                  return s.toList().takeLast(15)
              }

              fun hide(m: Manhwa) {
                  val ids = HashSet<String>(p().getStringSet("hid_ids", emptySet()) ?: emptySet())
                  ids.add(m.id.toString())
                  val titles = HashSet<String>(p().getStringSet("hid_titles", emptySet()) ?: emptySet())
                  titles.add(m.title)
                  p().edit().putStringSet("hid_ids", ids).putStringSet("hid_titles", titles).apply()
                  addTaste(m, -1.0)
              }

              private fun tasteMap(): MutableMap<String, Double> {
                  tasteCache?.let { return it }
                  val map = HashMap<String, Double>()
                  try {
                      val o = JSONObject(p().getString("taste", "{}"))
                      val keys = o.keys()
                      while (keys.hasNext()) {
                          val k = keys.next()
                          map[k] = o.optDouble(k, 0.0)
                      }
                  } catch (_: Exception) { }
                  tasteCache = map
                  return map
              }

              private fun addTaste(m: Manhwa, d: Double) {
                  val t = tasteMap()
                  for (g in m.genres) t[g] = (t[g] ?: 0.0) + d
                  for (g in m.tags.take(8)) t["#" + g] = (t["#" + g] ?: 0.0) + d * 0.5
                  val o = JSONObject()
                  for ((k, v) in t) o.put(k, v)
                  p().edit().putString("taste", o.toString()).apply()
              }

              fun affinity(m: Manhwa): Double {
                  val t = tasteMap()
                  var s = 0.0
                  for (g in m.genres) s += (t[g] ?: 0.0)
                  for (g in m.tags) s += 0.5 * (t["#" + g] ?: 0.0)
                  return s
              }

              fun affinityNorm(m: Manhwa): Double = affinity(m) / maxOf(1.0, m.genres.size + 0.5 * m.tags.size)

              fun hasTaste(): Boolean = tasteMap().values.any { it > 0.5 }

              fun topTasteGenres(n: Int): List<String> =
                  tasteMap().entries
                      .filter { !it.key.startsWith("#") && it.value > 0.5 }
                      .sortedByDescending { it.value }
                      .take(n)
                      .map { it.key }
          }

          /** تۆڕ: AniList (مانهواکان)، Gemini (AI)، وەرگێڕان، وێنەکان */
          object Net {
              val io: ExecutorService = Executors.newFixedThreadPool(6)
              val ui = Handler(Looper.getMainLooper())

              private val cache = object : LruCache<String, Bitmap>((Runtime.getRuntime().maxMemory() / 8).toInt()) {
                  override fun sizeOf(key: String, value: Bitmap): Int = value.byteCount
              }

              private const val FIELDS =
                  "id title{romaji english native} coverImage{large} averageScore popularity genres tags{name rank} " +
                      "description(asHtml:false) chapters status startDate{year} siteUrl countryOfOrigin isAdult"

              // @ دەگۆڕدرێت بە $ (بۆ ڕێگری لە تێکچوونی Kotlin string)
              private val Q_PAGE = (
                  "query(@page:Int,@perPage:Int,@sort:[MediaSort],@genres:[String],@search:String,@status:MediaStatus,@minScore:Int,@minPop:Int){" +
                      "Page(page:@page,perPage:@perPage){media(type:MANGA,countryOfOrigin:\"KR\",isAdult:false,sort:@sort,genre_in:@genres," +
                      "search:@search,status:@status,averageScore_greater:@minScore,popularity_greater:@minPop){" + FIELDS + "}}}"
                  ).replace('@', '$')

              private val Q_SIMILAR = (
                  "query(@id:Int){Media(id:@id){recommendations(sort:RATING_DESC,perPage:20){nodes{mediaRecommendation{" + FIELDS + "}}}}}"
                  ).replace('@', '$')

              fun <T> async(work: () -> T, ok: (T) -> Unit, fail: (String) -> Unit = {}) {
                  io.execute {
                      try {
                          val r = work()
                          ui.post { ok(r) }
                      } catch (e: Exception) {
                          val msg = e.message ?: "هەڵە"
                          ui.post { fail(msg) }
                      }
                  }
              }

              fun httpPost(url: String, body: String, headers: Map<String, String>): String {
                  val conn = URL(url).openConnection() as HttpURLConnection
                  try {
                      conn.requestMethod = "POST"
                      conn.connectTimeout = 8000
                      conn.readTimeout = 25000
                      conn.doOutput = true
                      for ((k, v) in headers) conn.setRequestProperty(k, v)
                      conn.outputStream.use { it.write(body.toByteArray(Charsets.UTF_8)) }
                      val code = conn.responseCode
                      val stream = if (code in 200..299) conn.inputStream else conn.errorStream
                      val text = stream?.bufferedReader()?.use { it.readText() } ?: ""
                      if (code !in 200..299) throw Exception("HTTP " + code + ": " + text.take(160))
                      return text
                  val root = JSONObject(resp)
                  if (root.isNull("data")) {
                      val errs = root.optJSONArray("errors")
                      val msg = errs?.optJSONObject(0)?.optString("message") ?: "AniList هەڵە"
                      throw Exception(msg)
                  }
                  return root.getJSONObject("data")
              }

              private fun parse(o: JSONObject): Manhwa? {
                  val country = o.str("countryOfOrigin")
                  if (country.isNotEmpty() && country != "KR") return null
                  if (o.optBoolean("isAdult", false)) return null
                  val t = o.optJSONObject("title") ?: return null
                  val en = t.str("english")
                  val ro = t.str("romaji")
                  val title = if (en.isNotBlank()) en else ro
                  if (title.isBlank()) return null
                  val alt = if (ro.isNotBlank() && ro != title) ro else t.str("native")
                  val cover = o.optJSONObject("coverImage")?.str("large") ?: ""
                  val tags = ArrayList<String>()
                  val tagArr = o.optJSONArray("tags")
                  if (tagArr != null) {
                      for (i in 0 until tagArr.length()) {
                          val tg = tagArr.optJSONObject(i) ?: continue
                          if (tg.optInt("rank") >= 50) tags.add(tg.str("name"))
                      }
                  }
                  val rawDesc = o.str("description")
                  val desc = if (rawDesc.isBlank()) "" else Html.fromHtml(rawDesc, Html.FROM_HTML_MODE_LEGACY).toString().trim()
                  return Manhwa(
                      id = o.optInt("id"),
                  for ((i, f) in futures.withIndex()) {
                      val m: Manhwa? = try { f.get() } catch (ex: Exception) { null }
                      if (m != null && seen.add(m.id)) {
                          m.reason = wanted[i].second
                          out.add(m)
                      }
                  }
                  return out
              }

              private fun translateChunk(text: String): String {
                  val urlString = "https://translate.googleapis.com/translate_a/single" +
                      "?client=gtx&sl=en&tl=ckb&dt=t&q=" + URLEncoder.encode(text, "UTF-8")
                  val conn = URL(urlString).openConnection() as HttpURLConnection
                  conn.connectTimeout = 6000
                  conn.readTimeout = 8000
                  conn.setRequestProperty("User-Agent", "Mozilla/5.0")
                  val response = conn.inputStream.bufferedReader().use { it.readText() }
                  val sub = JSONArray(response).getJSONArray(0)
                  val sb = StringBuilder()
                  for (i in 0 until sub.length()) sb.append(sub.getJSONArray(i).optString(0, ""))
                  return sb.toString().trim()
              }

              /** وەرگێڕانی دەقی درێژ بۆ کوردی سۆرانی (پارچە پارچە) */
              fun translateKu(text: String): String {
                  val parts = ArrayList<String>()
                  var cur = StringBuilder()
                  for (s in text.split(Regex("(?<=[.!?])\\s+"))) {
                      if (cur.isNotEmpty() && cur.length + s.length > 450) {
                          parts.add(cur.toString())
                          cur = StringBuilder()
                      }
                      cur.append(s).append(' ')
                  }
                  if (cur.isNotBlank()) parts.add(cur.toString())
                  val futures = parts.map { c -> io.submit(Callable<String> { translateChunk(c) }) }
                  return futures.joinToString(" ") { it.get() }
              }

              fun loadImage(url: String, iv: ImageView) {
                  iv.tag = url
                  if (url.isBlank()) {
                      iv.setImageDrawable(null)
                          if (bmp != null) {
                              cache.put(url, bmp)
                              ui.post { if (iv.tag == url) iv.setImageBitmap(bmp) }
                          }
                      } catch (_: Exception) { }
                  }
              }
          }
          KMEOF
          mkdir -p $(dirname app/src/main/java/com/kurdish/manhwareal/Ui.kt)
          cat > app/src/main/java/com/kurdish/manhwareal/Ui.kt <<'KMEOF'
          package com.kurdish.manhwareal

          import android.content.Context
          import android.graphics.Color
          import android.graphics.Outline
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.util.TypedValue
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.view.ViewOutlineProvider
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.recyclerview.widget.RecyclerView

          object Ui {
              val BG = 0xFF0B0F1A.toInt()
              val SURFACE = 0xFF141B2D.toInt()
              val SURFACE2 = 0xFF1C2540.toInt()
              val ACCENT = 0xFF7C5CFF.toInt()
              val ACCENT2 = 0xFF22D3EE.toInt()
              val TEXT = 0xFFE8ECF8.toInt()
              val MUTED = 0xFF8A94B2.toInt()
              val HEART = 0xFFFB7185.toInt()

              fun dp(c: Context, v: Int): Int = (v * c.resources.displayMetrics.density).toInt()

              fun round(c: Context, color: Int, radiusDp: Int): GradientDrawable {
                  val g = GradientDrawable()
                  g.setColor(color)
                  g.cornerRadius = dp(c, radiusDp).toFloat()
                  return g
              }

              fun grad(c: Context, a: Int, b: Int, radiusDp: Int): GradientDrawable {
                  val g = GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT, intArrayOf(a, b))
                  g.cornerRadius = dp(c, radiusDp).toFloat()
                  return g
              }

              fun clipRound(v: View, radiusDp: Int) {
                  val r = dp(v.context, radiusDp).toFloat()
                  v.clipToOutline = true
                  v.outlineProvider = object : ViewOutlineProvider() {
                      override fun getOutline(view: View, outline: Outline) {
                          outline.setRoundRect(0, 0, view.width, view.height, r)
                      }
                  }
              }

              fun tv(c: Context, text: String, sp: Float, color: Int, bold: Boolean = false): TextView {
                  val t = TextView(c)
                  t.text = text
                  t.setTextSize(TypedValue.COMPLEX_UNIT_SP, sp)
                  t.setTextColor(color)
                  if (bold) t.typeface = Typeface.DEFAULT_BOLD
                  return t
              }

              fun button(c: Context, text: String, filled: Boolean, onClick: (() -> Unit)? = null): TextView {
                  val b = tv(c, text, 14f, if (filled) Color.WHITE else TEXT, true)
                  b.gravity = Gravity.CENTER
                  b.setPadding(dp(c, 16), dp(c, 10), dp(c, 16), dp(c, 10))
                  b.background = if (filled) grad(c, ACCENT, ACCENT2, 14) else round(c, SURFACE2, 14)
                  if (onClick != null) b.setOnClickListener { onClick() }
                  return b
              }

              fun edit(c: Context, hint: String): EditText {
                  val e = EditText(c)
                  e.setPadding(dp(c, 14), dp(c, 12), dp(c, 14), dp(c, 12))
                  return e
              }

              fun statusKu(s: String): String = when (s) {
                  "RELEASING" -> "بەردەوامە"
                  "FINISHED" -> "تەواوبووە"
                  "HIATUS" -> "وەستاوە"
                  "CANCELLED" -> "هەڵوەشاوەتەوە"
                  "NOT_YET_RELEASED" -> "هێشتا نەهاتووە"
                  else -> ""
              }
          }

          class CardAdapter(
              private val ctx: Context,
              val items: MutableList<Manhwa>,
              private val showHide: Boolean,
              private val onOpen: (Manhwa) -> Unit,
              private val onHeart: (Manhwa) -> Unit,
              private val onHide: (Manhwa) -> Unit
          ) : RecyclerView.Adapter<CardAdapter.VH>() {

              class VH(
                  v: View,
                  val cover: ImageView,
                  val title: TextView,
                  val meta: TextView,
                  val reason: TextView,
                  val score: TextView,
                  val heart: TextView,
                  val hide: TextView
              ) : RecyclerView.ViewHolder(v)

              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                  val card = LinearLayout(ctx)
                  card.orientation = LinearLayout.VERTICAL
                  card.background = Ui.round(ctx, Ui.SURFACE, 16)
                  Ui.clipRound(card, 16)
                  val lp = RecyclerView.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  val m = Ui.dp(ctx, 6)
                  lp.setMargins(m, m, m, m)
                  card.layoutParams = lp

                  val frame = FrameLayout(ctx)
                  val cover = ImageView(ctx)
                  val hlp = FrameLayout.LayoutParams(Ui.dp(ctx, 36), Ui.dp(ctx, 36), Gravity.TOP or Gravity.END)
                  hlp.setMargins(Ui.dp(ctx, 8), Ui.dp(ctx, 8), Ui.dp(ctx, 8), Ui.dp(ctx, 8))
                  frame.addView(heart, hlp)

                  val hide = Ui.tv(ctx, "✕", 14f, Color.WHITE, true)
                  hide.gravity = Gravity.CENTER
                  hide.background = Ui.round(ctx, 0xCC000000.toInt(), 16)
                  val xlp = FrameLayout.LayoutParams(Ui.dp(ctx, 32), Ui.dp(ctx, 32), Gravity.BOTTOM or Gravity.END)
                  xlp.setMargins(Ui.dp(ctx, 8), Ui.dp(ctx, 8), Ui.dp(ctx, 8), Ui.dp(ctx, 8))
                  frame.addView(hide, xlp)
                  hide.visibility = if (showHide) View.VISIBLE else View.GONE

                  card.addView(frame, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT))

                  val info = LinearLayout(ctx)
                  info.orientation = LinearLayout.VERTICAL
                  info.setPadding(Ui.dp(ctx, 10), Ui.dp(ctx, 8), Ui.dp(ctx, 10), Ui.dp(ctx, 10))
                  val title = Ui.tv(ctx, "", 14f, Ui.TEXT, true)
                  title.maxLines = 2
                  val meta = Ui.tv(ctx, "", 11f, Ui.MUTED)
                  meta.maxLines = 1
                  val reason = Ui.tv(ctx, "", 11f, Ui.ACCENT2)
                  reason.maxLines = 4
                  reason.setPadding(0, Ui.dp(ctx, 4), 0, 0)
                  info.addView(title)
                  info.addView(meta)
                  info.addView(reason)
                  card.addView(info, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT))

                  val vh = VH(card, cover, title, meta, reason, score, heart, hide)
                  card.setOnClickListener {
                      val p = vh.bindingAdapterPosition
                      val p = vh.bindingAdapterPosition
                      if (p != RecyclerView.NO_POSITION) onHide(items[p])
                  }
                  return vh
              }

              override fun getItemCount(): Int = items.size

              override fun onBindViewHolder(h: VH, position: Int) {
                  val m = items[position]
                  Net.loadImage(m.cover, h.cover)
                  h.title.text = m.title
                  h.meta.text = m.genres.take(3).joinToString(" · ")
                  h.score.text = if (m.score > 0) "★ " + (m.score / 10.0) else "★ -"
                  val saved = Store.isSaved(m.id)
                  h.heart.text = if (saved) "♥" else "♡"
                  h.heart.setTextColor(if (saved) Ui.HEART else Color.WHITE)
                  if (m.reason.isBlank()) {
                      h.reason.visibility = View.GONE
                  } else {
                      h.reason.visibility = View.VISIBLE
                      h.reason.text = "✦ " + m.reason
                  }
              }
          }
          KMEOF
          mkdir -p $(dirname app/src/main/java/com/kurdish/manhwareal/MainActivity.kt)
          cat > app/src/main/java/com/kurdish/manhwareal/MainActivity.kt <<'KMEOF'
          package com.kurdish.manhwareal

          import android.Manifest
          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.drawable.ColorDrawable
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.text.InputType
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.view.inputmethod.EditorInfo
          import android.view.inputmethod.InputMethodManager
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.HorizontalScrollView
          import android.widget.ImageView
          import android.widget.LinearLayout
