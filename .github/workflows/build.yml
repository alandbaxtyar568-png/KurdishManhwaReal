          cat > app/src/main/java/com/kurdish/manhwareal/Auth.kt <<'KMEOF'
          package com.kurdish.manhwareal

          import android.app.Activity
          import android.content.Context
          import android.content.SharedPreferences
          import android.graphics.Color
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AlertDialog
          import androidx.core.content.ContextCompat
          import androidx.credentials.CredentialManager
          import androidx.credentials.CredentialManagerCallback
          import androidx.credentials.CustomCredential
          import androidx.credentials.GetCredentialRequest
          import androidx.credentials.GetCredentialResponse
          import androidx.credentials.exceptions.GetCredentialException
          import com.google.android.libraries.identity.googleid.GetGoogleIdOption
          import com.google.android.libraries.identity.googleid.GoogleIdTokenCredential
          import org.json.JSONObject
          import java.lang.ref.WeakReference
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.TimeUnit

          /**
           * چوونەژوورەوە بە Google. هیچ کلیلێکی AI لە ئەپەکەدا نییە:
           * ئەپەکە ID token ی Google دەنێرێت بۆ Worker، Worker دڵنیا دەبێتەوە و تۆکنی کاتی دەدات،
           * هەموو داواکارییەکانی دواتر بەو تۆکنەوە دەچن.
           */
          object Auth {
              @Volatile var token = ""
              @Volatile var email = ""
              @Volatile var name = ""
              @Volatile var admin = false
              @Volatile var exp = 0L
              @Volatile private var actRef: WeakReference<Activity>? = null
              private var prefs: SharedPreferences? = null
              private val lock = Any()
              private val main = Handler(Looper.getMainLooper())

              private fun nowSec(): Long = System.currentTimeMillis() / 1000

              fun init(act: Activity) {
                  actRef = WeakReference(act)
                  if (prefs == null) {
                      val p = act.applicationContext.getSharedPreferences("km_auth", Context.MODE_PRIVATE)
                      prefs = p
                      token = p.getString("t", "") ?: ""
                      email = p.getString("e", "") ?: ""
                      name = p.getString("n", "") ?: ""
                      admin = p.getBoolean("a", false)
                      exp = p.getLong("x", 0L)
                  }
              }

              fun valid(): Boolean = token.isNotEmpty() && exp - nowSec() > 120

              /** ئایا ئەم ئەپە ڕێگەپێدراوە؟ (ئەپی ئەدمین تەنها بۆ ئەدمینە) */
              fun allowed(): Boolean = valid() && (!BuildConfig.IS_ADMIN || admin)

              fun expire() {
                  exp = 0L
              }

              fun signOut() {
                  token = ""
                  exp = 0L
                  admin = false
                  email = ""
                  name = ""
                  prefs?.edit()?.clear()?.apply()
              }

              /** silent = true: بێ پرسیار، تەنها ئەگەر پێشتر چووبێتە ژوورەوە. cb(null) واتە سەرکەوتوو */
              fun signIn(act: Activity, silent: Boolean, cb: (String?) -> Unit) {
                  try {
                      val opt = GetGoogleIdOption.Builder()
                          .setFilterByAuthorizedAccounts(silent)
                          .setServerClientId(Secrets.GOOGLE_CLIENT_ID)
                          .setAutoSelectEnabled(silent)
                          .build()
                      val req = GetCredentialRequest.Builder().addCredentialOption(opt).build()
                      CredentialManager.create(act).getCredentialAsync(
                          act, req, null, ContextCompat.getMainExecutor(act),
                          object : CredentialManagerCallback<GetCredentialResponse, GetCredentialException> {
                              override fun onResult(result: GetCredentialResponse) {
                                  val c = result.credential
                                  if (c is CustomCredential && c.type == GoogleIdTokenCredential.TYPE_GOOGLE_ID_TOKEN_CREDENTIAL) {
                                      val idt = try {
                                          GoogleIdTokenCredential.createFrom(c.data).idToken
                                      } catch (e: Exception) {
                                          null
                                      }
                                      if (idt == null) cb("ئەکاونتەکە نەخوێندرایەوە") else exchange(idt, cb)
                                  } else {
                                      cb("جۆری ئەکاونت پشتگیری ناکرێت")
                                  }
                              }

                              override fun onError(e: GetCredentialException) {
                                  cb(e.message ?: "چوونەژوورەوە سەرنەکەوت")
                              }
                          }
                      )
                  } catch (e: Throwable) {
                      cb(e.message ?: "چوونەژوورەوە سەرنەکەوت")
                  }
              }

              private fun exchange(idToken: String, cb: (String?) -> Unit) {
                  Thread {
                      try {
                          val resp = Net.httpPost(
                              Secrets.PROXY.trimEnd('/') + "/auth",
                              JSONObject().put("idToken", idToken).toString(),
                              mapOf("Content-Type" to "application/json")
                          )
                          val o = JSONObject(resp)
                          token = o.getString("token")
                          exp = o.getLong("exp")
                          email = o.optString("email", "")
                          name = o.optString("name", "")
                          admin = o.optBoolean("admin", false)
                          prefs?.edit()?.putString("t", token)?.putString("e", email)?.putString("n", name)
                              ?.putBoolean("a", admin)?.putLong("x", exp)?.apply()
                          main.post { cb(null) }
                      } catch (e: Exception) {
                          val m = e.message ?: ""
                          main.post { cb(if (m.contains("HTTP 403")) "ئەم ئەکاونتە بلۆک کراوە" else "پەیوەندی بە سێرڤەرەوە سەرنەکەوت") }
                      }
                  }.start()
              }

              /** لە بەکگراوندەوە بانگ دەکرێت: تۆکنی دروست دەگەڕێنێتەوە، ئەگەر بەسەرچوو بێت بێدەنگ نوێی دەکاتەوە */
              fun ensure(): String {
                  if (valid()) return token
                  synchronized(lock) {
                      if (valid()) return token
                      val a = actRef?.get()
                      if (a != null && !a.isFinishing) {
                          val latch = CountDownLatch(1)
                          main.post {
                              try {
                                  signIn(a, true) { latch.countDown() }
                              } catch (e: Throwable) {
                                  latch.countDown()
                              }
                          }
                          latch.await(25, TimeUnit.SECONDS)
                      }
                      if (valid()) return token
                  }
                  throw Exception("LOGIN_REQUIRED")
              }
          }

          /** شاشەی چوونەژوورەوە: تا نەچیتە ژوورەوە ئەپەکە بەکارنایەت */
          object LoginGate {
              private var gate: View? = null

              private fun hide() {
                  val g = gate ?: return
                  (g.parent as? ViewGroup)?.removeView(g)
                  gate = null
              }

              fun attach(act: Activity) {
                  if (Auth.allowed()) {
                      hide()
                      return
                  }
                  if (gate?.parent != null) return
                  if (Auth.valid() && BuildConfig.IS_ADMIN && !Auth.admin) Auth.signOut()

                  val content = act.findViewById<ViewGroup>(android.R.id.content)
                  val col = LinearLayout(act)
                  col.orientation = LinearLayout.VERTICAL
                  col.gravity = Gravity.CENTER
                  col.layoutDirection = View.LAYOUT_DIRECTION_RTL
                  col.setBackgroundColor(Ui.BG)
                  col.isClickable = true
                  col.setPadding(Ui.dp(act, 28), Ui.dp(act, 28), Ui.dp(act, 28), Ui.dp(act, 28))

                  val title = Ui.tv(act, if (BuildConfig.IS_ADMIN) "👑 KMR Admin" else "Kurdish Manhwa Real", 24f, Ui.TEXT, true)
                  title.gravity = Gravity.CENTER
                  col.addView(title, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT))

                  val sub = Ui.tv(
                      act,
                      if (BuildConfig.IS_ADMIN) "تەنها بۆ ئەدمین. بە ئەکاونتی Google ـی ئەدمین بچۆ ژوورەوە."
                      else "بۆ بەکارهێنانی ئەپەکە دەبێت بە ئەکاونتی Google بچیتە ژوورەوە.",
                      14f, Ui.MUTED
                  )
                  sub.gravity = Gravity.CENTER
                  sub.setPadding(0, Ui.dp(act, 10), 0, Ui.dp(act, 24))
                  col.addView(sub, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT))

                  val status: TextView = Ui.tv(act, "تکایە چاوەڕێ بە...", 13f, Color.WHITE)
                  status.gravity = Gravity.CENTER
                  status.setPadding(0, 0, 0, Ui.dp(act, 14))

                  lateinit var btn: TextView
                  fun finish() {
                      if (Auth.allowed()) {
                          hide()
                      } else {
                          if (Auth.valid()) Auth.signOut()
                          btn.visibility = View.VISIBLE
                          status.text = if (BuildConfig.IS_ADMIN) "ئەم ئەکاونتە ئەدمین نییە" else "چوونەژوورەوە سەرنەکەوت"
                      }
                  }
                  btn = Ui.button(act, "G   چوونەژوورەوە بە Google", true) {
                      btn.visibility = View.GONE
                      status.text = "..."
                      Auth.signIn(act, false) { err ->
                          if (err == null) {
                              finish()
                          } else {
                              btn.visibility = View.VISIBLE
                              status.text = err
                          }
                      }
                  }
                  btn.visibility = View.GONE
                  col.addView(status, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT))
                  col.addView(btn, LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT))

                  gate = col
                  content.addView(col, FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT))

                  // یەکەم هەوڵ بێدەنگ (ئەگەر پێشتر چووبێتە ژوورەوە)
                  Auth.signIn(act, true) { err ->
                      if (err == null) {
                          finish()
                      } else {
                          btn.visibility = View.VISIBLE
                          status.text = ""
                      }
                  }
              }
          }

          /**
           * سنووری ڕۆژانە: ٣٠ چاپتەر، دواتر ئاگادارکردنەوە و ٣٠ی تر، پاشان بۆ ئەمڕۆ تەواو.
           * ژماردنەکە لەسەر سێرڤەرە (/chapter) و بێ «بلیت» (ticket) ی سێرڤەر وەرگێڕان کار ناکات.
           */
          object Quota {
              @Volatile var ticket = ""
              @Volatile var ticketUrl = ""
              @Volatile private var ticketAt = 0L
              private val main = Handler(Looper.getMainLooper())

              fun norm(u: String?): String = (u ?: "").substringBefore('#').substringBefore('?').trimEnd('/').lowercase()

              fun needs(url: String?): Boolean {
                  val u = norm(url)
                  if (u.isEmpty()) return false
                  return ticket.isEmpty() || u != ticketUrl || System.currentTimeMillis() - ticketAt > 3 * 3600 * 1000L
              }

              /** cb(true) واتە دەتوانێت ئەم چاپتەرە وەرگێڕێت */
              fun begin(act: Activity, url: String?, cb: (Boolean) -> Unit) {
                  val u = norm(url)
                  if (u.isEmpty() || !needs(url)) {
                      cb(true)
                      return
                  }
                  post(act, u, false, cb)
              }

              private fun post(act: Activity, u: String, confirm: Boolean, cb: (Boolean) -> Unit) {
                  Thread {
                      try {
                          val resp = Net.authedPost(
                              Secrets.PROXY.trimEnd('/') + "/chapter",
                              JSONObject().put("url", u).put("confirm", confirm).toString()
                          )
                          val o = JSONObject(resp)
                          ticket = o.getString("ticket")
                          ticketUrl = u
                          ticketAt = System.currentTimeMillis()
                          main.post { cb(true) }
                      } catch (e: Exception) {
                          val m = e.message ?: ""
                          main.post {
                              when {
                                  m.contains("HTTP 409") -> warn(act, u, cb)
                                  m.contains("HTTP 429") -> {
                                      limit(act)
                                      cb(false)
                                  }
                                  else -> {
                                      Toast.makeText(act, "پەیوەندی بە سێرڤەرەوە سەرنەکەوت", Toast.LENGTH_LONG).show()
                                      cb(false)
                                  }
                              }
                          }
                      }
                  }.start()
              }

              private fun warn(act: Activity, u: String, cb: (Boolean) -> Unit) {
                  AlertDialog.Builder(act)
                      .setTitle("٣٠ چاپتەر! 😄")
                      .setMessage("٣٠ چاپتەرت خوێندەوە! ئەگەر دەتەوێت بەردەوام بیت، چاوەکانت و خەوەکەت بەلاوە گرنگ نین؟ 😄\n\n٣٠ چاپتەری تر بۆ ئەمڕۆ ڕێگەپێدراوە.")
                      .setCancelable(false)
                      .setPositiveButton("بەردەوام بە") { _, _ -> post(act, u, true, cb) }
                      .setNegativeButton("با پشوو بدەم") { _, _ -> cb(false) }
                      .show()
              }

              private fun limit(act: Activity) {
                  AlertDialog.Builder(act)
                      .setTitle("٦٠ چاپتەر! 🛑")
                      .setMessage("٦٠ چاپتەرت خوێندەوە! خۆ چاوەکانت نەتوێنەوە؟ 😅\n\nبۆ ئەمڕۆ تەواو بوو، سبەینێ بگەڕێوە و بەردەوام به.")
                      .setPositiveButton("باشە", null)
                      .show()
              }
          }
