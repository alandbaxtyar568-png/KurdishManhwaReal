              private fun aiErr(err: String): String =
                  if (err.contains("HTTP 429"))
                      "داواکاری زۆرە، کەمێک چاوەڕێ بکە و دووبارە هەوڵ بدە"
                  else if (err.contains("API key", true) || err.contains("PERMISSION_DENIED") || err.contains("دانەنراوە"))
                      "کلیلی AI هەڵەیە یان دانەنراوە"
                  else
                      "AI هەڵەی دا: " + err.take(140)

