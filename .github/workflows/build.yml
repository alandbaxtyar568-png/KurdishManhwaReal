                  "Action" to "ئاکشن", "Fantasy" to "فانتازیا", "Romance" to "ڕۆمانسی", "Comedy" to "کۆمیدی",
                  "Drama" to "دراما", "Adventure" to "سەرکێشی", "Supernatural" to "سروشتبەدەر", "Mystery" to "نهێنی",
                  "Psychological" to "دەروونی", "Thriller" to "هەیجان", "Horror" to "ترسناک",
