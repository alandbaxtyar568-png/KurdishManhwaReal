              private fun selectTab(i: Int) {
                  discoverPage.visibility = if (i == 0) View.VISIBLE else View.GONE
                  translatePage.visibility = if (i == 1) View.VISIBLE else View.GONE
                  savedPage.visibility = if (i == 2) View.VISIBLE else View.GONE
                  webTab.root.visibility = if (i == 3) View.VISIBLE else View.GONE
                  for ((idx, item) in navItems.withIndex()) {
                      val color = if (idx == i) Ui.ACCENT2 else Ui.MUTED
                      for (k in 0 until item.childCount) (item.getChildAt(k) as TextView).setTextColor(color)
                  }
                  if (i == 2) refreshSaved()
                  if (i == 1) refreshTranslateUi()
                  if (i == 3) webTab.onShown()
                  if (i != 3) webTab.exitFullscreen()
              }

